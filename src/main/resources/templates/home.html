<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cinema All Star</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white py-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/home">Cinema All Star</a>
        <div class="navbar-nav">
            <a class="nav-link" href="#">Phim</a>
            <a class="nav-link" href="#">Star Shop</a>
            <a class="nav-link" href="#">Sự Kiện</a>
        </div>

        <div class="navbar-nav ms-auto">
            <th:block sec:authorize="isAnonymous()">
                <a class="nav-link fw-bold text-primary" th:href="@{/login}">Đăng Nhập</a>
            </th:block>

            <div class="nav-item dropdown" sec:authorize="isAuthenticated()">
                <a class="nav-link dropdown-toggle d-flex align-items-center text-decoration-none py-0"
                   href="javascript:void(0)" id="userDropdown" role="button" tabindex="0" aria-expanded="false">

                    <div class="avatar-circle-wrap me-2">
                        <i class="bi bi-person-fill text-secondary fs-5"></i>
                    </div>

                    <span class="fw-bold user-name-text" sec:authentication="name">Tên Khách Hàng</span>
                </a>

                <ul class="dropdown-menu dropdown-menu-end custom-profile-menu border-0 shadow py-2" aria-labelledby="userDropdown">
                    <li>
                        <a class="dropdown-item d-flex align-items-center py-2.5 px-4" href="/profile">
                            <i class="bi bi-person-badge fs-5 me-3 fw-bold"></i>
                            <span class="menu-item-text">Tài Khoản</span>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item d-flex align-items-center py-2.5 px-4" href="/my-tickets">
                            <i class="bi bi-list-ol fs-5 me-3 fw-bold"></i>
                            <span class="menu-item-text">Lịch Sử</span>
                        </a>
                    </li>

                    <li sec:authorize="hasRole('Admin')">
                        <hr class="dropdown-divider">
                    </li>
                    <li sec:authorize="hasRole('Admin')">
                        <a class="dropdown-item d-flex align-items-center py-2.5 px-4 text-danger fw-bold" href="/admin/home">
                            <i class="bi bi-shield-lock fs-5 me-3"></i>
                            <span class="menu-item-text">Quản Trị Hệ Thống</span>
                        </a>
                    </li>

                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" id="logoutForm" class="d-none"></form>
                        <a class="dropdown-item d-flex align-items-center py-2.5 px-4" href="javascript:void(0)" onclick="document.getElementById('logoutForm').submit();">
                            <i class="bi bi-box-arrow-left fs-5 me-3 fw-bold"></i>
                            <span class="menu-item-text">Đăng xuất</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid p-0">
    <img src="https://i.pinimg.com/1200x/cb/a2/8f/cba28fa0c8e5cc8823090c602378ec0f.jpg" class="w-100" alt="Banner">
</div>

<div class="container search-bar-container">
    <div class="row bg-white p-3 shadow rounded">
        <div class="col-md-3"><select class="form-select"><option>Chọn Phim</option></select></div>
        <div class="col-md-3"><select class="form-select"><option>Chọn Rạp</option></select></div>
        <div class="col-md-2"><select class="form-select"><option>Chọn Ngày</option></select></div>
        <div class="col-md-2"><select class="form-select"><option>Chọn Suất</option></select></div>
        <div class="col-md-2"><button class="btn btn-warning w-100 fw-bold">Mua vé nhanh</button></div>
    </div>
</div>

<div class="container mt-5">
    <h3 class="mb-4">PHIM ĐANG CHIẾU</h3>
    <div class="row">
        <div class="col-md-3 mb-4" th:each="movie : ${homePage.phimDangChieu}">
            <div class="card border-0">
                <img th:src="${movie.poster}" class="card-img-top rounded" style="height: 350px; object-fit: cover;">
                <div class="card-body p-0 pt-2">
                    <h6 class="card-title" th:text="${movie.tenPhim}">Tên phim</h6>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container mt-5">
    <h3 class="mb-4">TIN KHUYẾN MÃI</h3>
    <div class="row">
        <div class="col-md-3 mb-4" th:each="promo : ${homePage.khuyenMai}">
            <div class="card border-0">
                <img th:src="${promo.poster}" class="img-fluid rounded mb-2" alt="Khuyến mãi">
                <p class="fw-bold" th:text="${promo.tenKhuyenMai}">Tiêu đề khuyến mãi</p>
                <small class="text-muted" th:text="${promo.moTa}">Mô tả ngắn</small>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-light mt-5 py-5">
    <div class="container text-center">
        <p>Galaxy Cinema - Copyright 2026</p>
    </div>
</footer>

</body>
</html>
