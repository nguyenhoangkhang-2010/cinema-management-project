<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Khuyến Mãi - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
    <link rel="stylesheet" th:href="@{/css/admin-common.css}">
</head>
<body>
    <div class="admin-container">
        
        <!-- CỘT BÊN TRÁI: SIDEBAR MENU -->
        <div th:replace="~{admin/sidebar :: sidebar('promotions')}"></div>

        <!-- CỘT BÊN PHẢI: NỘI DUNG CHÍNH -->
        <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
            <!-- Header -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <div class="d-flex align-items-center">
                    <h4 class="m-0 fw-bold text-primary"><i class="bi bi-gift me-2"></i>Quản Lý Khuyến Mãi</h4>
                </div>
                <div class="ms-auto d-flex align-items-center">
                    <span class="me-3 fw-medium text-secondary">Xin chào, <b class="text-dark">Quản Trị Viên</b></span>
                </div>
            </nav>

            <!-- Bảng danh sách Khuyến Mãi -->
            <div class="container-fluid p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                    <form th:action="@{/admin/promotions}" method="get" class="d-flex gap-2 align-items-center flex-wrap">
                        <input type="text" name="search" th:value="${search}" class="form-control form-control-sm" placeholder="Tìm theo ID, Tên..." style="width: 200px;">
                        <select name="filter" class="form-select form-select-sm" style="width: 150px;">
                            <option value="ALL" th:selected="${filter == 'ALL'}">Tất cả trạng thái</option>
                            <option value="ACTIVE" th:selected="${filter == 'ACTIVE'}">Đang hoạt động</option>
                            <option value="INACTIVE" th:selected="${filter == 'INACTIVE'}">Ngưng hoạt động</option>
                            <option value="UPCOMING" th:selected="${filter == 'UPCOMING'}">Chưa bắt đầu</option>
                            <option value="EXPIRED" th:selected="${filter == 'EXPIRED'}">Hết hạn</option>
                        </select>
                        <select name="sort" class="form-select form-select-sm" style="width: 200px;">
                            <option value="id_desc" th:selected="${sort == 'id_desc'}">Mã KM giảm dần</option>
                            <option value="id_asc" th:selected="${sort == 'id_asc'}">Mã KM tăng dần</option>
                            <option value="start_newest" th:selected="${sort == 'start_newest'}">Ngày bắt đầu mới nhất</option>
                            <option value="start_oldest" th:selected="${sort == 'start_oldest'}">Ngày bắt đầu cũ nhất</option>
                            <option value="end_nearest" th:selected="${sort == 'end_nearest'}">Ngày kết thúc gần nhất</option>
                            <option value="end_farthest" th:selected="${sort == 'end_farthest'}">Ngày kết thúc xa nhất</option>
                        </select>
                        <button type="submit" class="btn btn-dark btn-sm fw-bold"><i class="bi bi-funnel"></i> Lọc</button>
                        <a th:href="@{/admin/promotions}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise"></i> Reset</a>
                    </form>
                    <a th:href="@{/admin/promotions/add}" class="btn btn-primary fw-bold shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Thêm Khuyến Mãi Mới
                    </a>
                </div>

                <div class="card border-0 shadow-sm table-container">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0" style="table-layout: fixed; word-wrap: break-word;">
                            <thead class="table-dark">
                                <tr class="align-middle">
                                    <th class="ps-4 py-3 rounded-top-left text-start" style="width: 5%;">ID</th>
                                    <th class="py-3 text-start" style="width: 18%;">Tên Khuyến Mãi</th>
                                    <th class="py-3 text-start" style="width: 15%;">Mô Tả</th>
                                    <th class="py-3 text-center" style="width: 8%;">Giảm (%)</th>
                                    <th class="py-3 text-center" style="width: 8%;">Số Lượng</th>
                                    <th class="py-3 text-center" style="width: 10%;">Loại TK Tối Thiểu</th>
                                    <th class="py-3 text-center" style="width: 10%;">Ngày Bắt Đầu</th>
                                    <th class="py-3 text-center" style="width: 10%;">Ngày Kết Thúc</th>
                                    <th class="py-3 text-center" style="width: 8%;">Trạng Thái</th>
                                    <th class="py-3 text-end pe-4 rounded-top-right" style="width: 8%;">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Render danh sách khuyến mãi -->
                                <tr th:each="promo : ${promotions}">
                                    <td class="ps-4 fw-bold text-secondary text-start" th:text="${promo.maKhuyenMai}">1</td>
                                    <td class="fw-semibold text-dark text-start">
                                        <div class="d-flex align-items-center">
                                            <img th:src="${promo.poster != null and promo.poster != '' ? promo.poster : 'https://placehold.co/50x50'}" class="rounded me-2" style="width: 40px; height: 40px; object-fit: cover;">
                                            <span th:text="${promo.tenKhuyenMai}">Tên khuyến mãi</span>
                                        </div>
                                    </td>
                                    <td class="text-start text-truncate" style="max-width: 150px;" th:title="${promo.moTa}" th:text="${promo.moTa}">Mô tả...</td>
                                    <td class="text-center fw-bold text-danger" th:text="${promo.phanTramGiam != null ? promo.phanTramGiam + '%' : '0%'}">10%</td>
                                    <td class="text-center fw-medium" th:text="${promo.soLuong}">100</td>
                                    <td class="text-center fw-medium" th:text="${promo.loaiTaiKhoanToiThieu}">Thường</td>
                                    <td class="text-center" th:text="${promo.ngayBatDau != null ? #temporals.format(promo.ngayBatDau, 'dd/MM/yyyy') : 'N/A'}">--/--/----</td>
                                    <td class="text-center" th:text="${promo.ngayKetThuc != null ? #temporals.format(promo.ngayKetThuc, 'dd/MM/yyyy') : 'N/A'}">--/--/----</td>
                                    <td class="text-center">
                                        <th:block th:with="now=${#temporals.createNow().toLocalDate()},
                                                           isNgung=${promo.trangThaiKhuyenMai != null and promo.trangThaiKhuyenMai.name() == 'Ngung'},
                                                           isHoatDong=${promo.trangThaiKhuyenMai != null and promo.trangThaiKhuyenMai.name() == 'HoatDong'},
                                                           isUpcoming=${isHoatDong and promo.ngayBatDau != null and promo.ngayBatDau.isAfter(now)},
                                                           isExpired=${isHoatDong and promo.ngayKetThuc != null and promo.ngayKetThuc.isBefore(now)},
                                                           isActive=${isHoatDong and !isUpcoming and !isExpired}">
                                            <span class="badge bg-danger" th:if="${isNgung}">Ngưng hoạt động</span>
                                            <span class="badge bg-secondary" th:if="${isUpcoming}">Chưa bắt đầu</span>
                                            <span class="badge bg-warning text-dark" th:if="${isExpired}">Hết hạn</span>
                                            <span class="badge bg-success" th:if="${isActive}">Đang hoạt động</span>
                                        </th:block>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/admin/promotions/edit/{id}(id=${promo.maKhuyenMai})}" class="btn btn-sm btn-outline-primary me-1 btn-action"><i class="bi bi-pencil-square"></i> Sửa</a>
                                        <a th:href="@{/admin/promotions/delete/{id}(id=${promo.maKhuyenMai})}" class="btn btn-sm btn-outline-danger btn-action" th:onclick="confirmDeleteAction(event, this.href, 'Xóa khuyến mãi?', 'Bạn có chắc chắn muốn xóa khuyến mãi này không?')"><i class="bi bi-trash"></i> Xóa</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Phân trang -->
            <div class="d-flex justify-content-center mt-3">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm shadow-sm" id="paginationControls">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tableBody = document.querySelector('tbody');
            const rows = Array.from(tableBody.querySelectorAll('tr'));
            const paginationControls = document.getElementById('paginationControls');
            const itemsPerPage = 5;
            let currentPage = 1;
            const totalPages = Math.ceil(rows.length / itemsPerPage);

            function renderTable() {
                rows.forEach(row => row.style.display = 'none');
                const start = (currentPage - 1) * itemsPerPage;
                const end = start + itemsPerPage;
                rows.slice(start, end).forEach(row => row.style.display = '');
                renderPagination();
            }

            function renderPagination() {
                paginationControls.innerHTML = '';
                if (totalPages <= 1) return;

                const prevLi = document.createElement('li');
                prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
                prevLi.innerHTML = `<a class="page-link" href="#">&laquo;</a>`;
                prevLi.onclick = (e) => { e.preventDefault(); if (currentPage > 1) { currentPage--; renderTable(); } };
                paginationControls.appendChild(prevLi);

                for (let i = 1; i <= totalPages; i++) {
                    const li = document.createElement('li');
                    li.className = `page-item ${currentPage === i ? 'active' : ''}`;
                    li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
                    li.onclick = (e) => { e.preventDefault(); currentPage = i; renderTable(); };
                    paginationControls.appendChild(li);
                }

                const nextLi = document.createElement('li');
                nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
                nextLi.innerHTML = `<a class="page-link" href="#">&raquo;</a>`;
                nextLi.onclick = (e) => { e.preventDefault(); if (currentPage < totalPages) { currentPage++; renderTable(); } };
                paginationControls.appendChild(nextLi);
            }

            renderTable();
        });

        function confirmDeleteAction(event, url, titleText, messageText) {
            event.preventDefault();
            Swal.fire({
                title: titleText,
                text: messageText,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Đồng ý xóa',
                cancelButtonText: 'Hủy bỏ',
                borderRadius: '16px'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = url;
                }
            });
        }
    </script>
</body>
</html>
