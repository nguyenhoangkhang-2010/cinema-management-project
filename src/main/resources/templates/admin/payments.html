<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Thanh Toán - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
</head>
<body>
    <div class="admin-container">
        <div th:replace="~{admin/sidebar :: sidebar('payments')}"></div>
        <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <h4 class="m-0 fw-bold text-primary"><i class="bi bi-credit-card me-2"></i>Quản Lý Thanh Toán</h4>
            </nav>
            <div class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <form th:action="@{/admin/payments}" method="get" class="d-flex gap-2">
                        <select name="status" class="form-select">
                            <option value="">Tất cả trạng thái</option>
                            <option value="ThanhCong" th:selected="${status == 'ThanhCong'}">Thành công</option>
                            <option value="ThatBai" th:selected="${status == 'ThatBai'}">Thất bại</option>
                            <option value="DangXuLy" th:selected="${status == 'DangXuLy'}">Đang xử lý</option>
                        </select>
                        <button type="submit" class="btn btn-dark"><i class="bi bi-funnel"></i> Lọc</button>
                        <a th:href="@{/admin/payments}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></a>
                    </form>
                </div>
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4 py-3">Mã TT</th>
                                    <th>Mã Đặt Vé</th>
                                    <th>Khách Hàng</th>
                                    <th>Số Tiền</th>
                                    <th>Phương Thức</th>
                                    <th>Trạng Thái</th>
                                    <th class="pe-4 text-end">Ngày Thanh Toán</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${payments.empty}">
                                    <td colspan="7" class="text-center py-4">Không có dữ liệu thanh toán</td>
                                </tr>
                                <tr th:each="p : ${payments.content}">
                                    <td class="ps-4 fw-bold text-secondary">#[[${p.maThanhToan}]]</td>
                                    <td class="fw-bold text-primary">#[[${p.maDatVe}]]</td>
                                    <td th:text="${p.hoTenKhachHang}">Khách Hàng</td>
                                    <td class="text-success fw-bold" th:text="${#numbers.formatDecimal(p.soTien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                    <td><span class="badge bg-info text-dark" th:text="${p.phuongThuc}"></span></td>
                                    <td>
                                        <span class="badge" th:classappend="${p.trangThai == 'ThanhCong' ? 'bg-success' : (p.trangThai == 'ThatBai' ? 'bg-danger' : 'bg-warning text-dark')}" th:text="${p.trangThai}"></span>
                                    </td>
                                    <td class="pe-4 text-end" th:text="${#temporals.format(p.ngayThanhToan, 'dd/MM/yyyy HH:mm:ss')}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <div class="d-flex justify-content-center mt-4" th:if="${payments.totalPages > 1}">
                    <nav>
                        <ul class="pagination pagination-sm">
                            <li class="page-item" th:classappend="${payments.number == 0 ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/payments(page=${payments.number}, status=${status})}">&laquo;</a></li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(1, payments.totalPages)}" th:classappend="${payments.number == i - 1 ? 'active' : ''}"><a class="page-link" th:href="@{/admin/payments(page=${i}, status=${status})}" th:text="${i}"></a></li>
                            <li class="page-item" th:classappend="${payments.number == payments.totalPages - 1 ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/payments(page=${payments.number + 2}, status=${status})}">&raquo;</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
