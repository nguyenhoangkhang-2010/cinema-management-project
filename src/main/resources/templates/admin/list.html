<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Danh Sách Phim - All Star Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .table-container {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #1e293b !important;
            color: #f8fafc;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 1rem 1.2rem;
            border: none;
        }
        .table tbody td {
            padding: 1rem 1.2rem;
            color: #334155;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .table-hover tbody tr:hover {
            background-color: #f8fafc;
            transition: background-color 0.2s ease;
        }
        .badge-custom {
            padding: 0.45rem 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .btn-action {
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .form-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            cursor: pointer;
        }

        .bg-warning-subtle { background-color: #fef3c7 !important; }
        .text-warning-mapping { color: #d97706 !important; }
        .bg-success-subtle { background-color: #dcfce7 !important; }
        .bg-danger-subtle { background-color: #fee2e2 !important; }
        .bg-primary-subtle { background-color: #e0f2fe !important; }
    </style>
</head>
<body>
<div class="admin-container">

    <div th:replace="~{admin/sidebar :: sidebar('movies')}"></div>

    <div class="w-100 flex-grow-1 d-flex flex-column">

        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
            <div class="d-flex align-items-center">
                <h4 class="m-0 fw-bold text-dark">
                    <i class="bi bi-camera-reels-fill text-primary me-2"></i>Quản Lý Danh Sách Phim
                </h4>
            </div>
            <div class="ms-auto d-flex align-items-center">
                <span class="me-3 fw-medium text-secondary">Xin chào, <b class="text-dark">Quản Trị Viên</b></span>
            </div>
        </nav>

        <div class="container-fluid p-4 flex-grow-1">

            <div class="row g-3 align-items-center mb-4">
                <div class="col-md-5">
                    <form th:action="@{/admin/movies}" method="get" class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="search" th:value="${searchKeyword}" class="form-control border-start-0 ps-0" placeholder="Tìm tên phim hoặc quốc gia...">
                        <button type="submit" class="btn btn-dark px-3 fw-semibold">Tìm kiếm</button>
                    </form>
                </div>

                <div class="col-md-7 text-end">
                    <button id="btnDeleteSelected" class="btn btn-danger me-2 fw-semibold p-2 px-3 rounded-3 shadow-sm d-none" onclick="deleteSelectedMovies()">
                        <i class="bi bi-trash3-fill me-1"></i> Xóa mục đã chọn (<span id="selectCount">0</span>)
                    </button>

                    <a th:href="@{/admin/movies/add}" class="btn btn-primary fw-bold p-2 px-3 rounded-3 shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Thêm Phim Mới
                    </a>
                </div>
            </div>

            <div class="card border-0 shadow-sm table-container">
                <form id="bulkDeleteForm" th:action="@{/admin/movies/delete-multiple}" method="post">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" style="table-layout: fixed; word-wrap: break-word;">
                            <thead>
                            <tr>
                                <th style="width: 5%;" class="ps-4">
                                    <input type="checkbox" id="selectAll" class="form-check-input form-checkbox" onclick="toggleSelectAll(this)">
                                </th>
                                <th style="width: 8%;">ID</th>
                                <th style="width: 25%;">Tên Bộ Phim</th>
                                <th style="width: 15%;" class="text-center">Quốc Gia</th>
                                <th style="width: 12%;" class="text-center">Thời Lượng</th>
                                <th style="width: 15%;" class="text-center">Ngày Khởi Chiếu</th>
                                <th style="width: 13%;" class="text-center">Trạng Thái</th>
                                <th style="width: 12%;" class="text-end pe-4">Thao Tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="movie : ${movies}">
                                <td class="ps-4">
                                    <input type="checkbox" name="movieIds" th:value="${movie.maPhim}" class="form-check-input form-checkbox movie-checkbox" onclick="updateSelectCount()">
                                </td>
                                <td class="fw-bold text-secondary" th:text="${'#' + movie.maPhim}">#1</td>
                                <td class="fw-bold text-dark text-truncate" th:text="${movie.tenPhim}">Avenger: Hồi Kết</td>
                                <td class="text-center fw-medium text-secondary" th:text="${movie.quocGia != null ? movie.quocGia : 'N/A'}">Mỹ</td>
                                <td class="text-center fw-medium" th:text="${movie.thoiLuong != null ? movie.thoiLuong + ' phút' : 'N/A'}">180 phút</td>
                                <td class="text-center text-secondary">
                                    <span th:if="${movie.ngayKhoiChieu != null}" th:text="${#temporals.format(movie.ngayKhoiChieu, 'dd/MM/yyyy')}">20/05/2026</span>
                                    <span th:if="${movie.ngayKhoiChieu == null}" class="text-muted small">Chưa cập nhật</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge badge-custom"
                                          th:classappend="${movie.trangThai.name() == 'DangChieu' ? 'bg-success-subtle text-success border border-success-subtle' :
                                                         (movie.trangThai.name() == 'SapChieu' ? 'bg-warning-subtle text-warning-mapping border border-warning-subtle' :
                                                         (movie.trangThai.name() == 'NgungChieu' ? 'bg-danger-subtle text-danger border border-danger-subtle' :
                                                         'bg-primary-subtle text-primary border border-primary-subtle'))}"
                                          th:text="${movie.trangThai.name() == 'DangChieu' ? 'Đang Chiếu' : (movie.trangThai.name() == 'SapChieu' ? 'Sắp Chiếu' : (movie.trangThai.name() == 'NgungChieu' ? 'Ngừng Chiếu' : 'Chiếu Online'))}">Đang Chiếu</span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="d-inline-flex">
                                        <a th:href="@{/admin/movies/edit/{id}(id=${movie.maPhim})}" class="btn btn-sm btn-outline-primary btn-action me-2">
                                            <i class="bi bi-pencil"></i> Sửa
                                        </a>
                                        <a th:href="@{/admin/movies/delete/{id}(id=${movie.maPhim})}"
                                           class="btn btn-sm btn-outline-danger btn-action"
                                           th:onclick="confirmDeleteSingle(event, this.href)">
                                            <i class="bi bi-trash"></i> Xóa
                                        </a>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(movies)}">
                                <td colspan="8" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>
                                    Không tìm thấy bộ phim nào phù hợp trong cơ sở dữ liệu.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </form>
            </div>

            <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-4">
                <div class="text-muted small">
                    Hiển thị trang <span class="fw-bold text-dark" th:text="${currentPage + 1}"></span> / <span th:text="${totalPages}"></span> trang
                </div>
                <nav>
                    <ul class="pagination pagination-sm m-0 gap-1">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link rounded-2 border-0 bg-white text-dark shadow-sm" th:href="@{/admin/movies(page=${currentPage - 1}, search=${searchKeyword})}"><i class="bi bi-chevron-left"></i></a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link rounded-2 border-0 shadow-sm" th:classappend="${currentPage == i} ? 'bg-primary text-white' : 'bg-white text-dark'" th:href="@{/admin/movies(page=${i}, search=${searchKeyword})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link rounded-2 border-0 bg-white text-dark shadow-sm" th:href="@{/admin/movies(page=${currentPage + 1}, search=${searchKeyword})}"><i class="bi bi-chevron-right"></i></a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
</div>

<script>
    function toggleSelectAll(master) {
        const checkboxes = document.getElementsByClassName('movie-checkbox');
        for (let i = 0; i < checkboxes.length; i++) {
            checkboxes[i].checked = master.checked;
        }
        updateSelectCount();
    }

    function updateSelectCount() {
        const checkboxes = document.getElementsByClassName('movie-checkbox');
        const masterCheckbox = document.getElementById('selectAll');
        const btnDelete = document.getElementById('btnDeleteSelected');
        const txtCount = document.getElementById('selectCount');

        let checkedCount = 0;
        for (let i = 0; i < checkboxes.length; i++) {
            if (checkboxes[i].checked) checkedCount++;
        }

        masterCheckbox.checked = (checkedCount === checkboxes.length && checkboxes.length > 0);

        if (checkedCount > 0) {
            btnDelete.classList.remove('d-none');
            txtCount.innerText = checkedCount;
        } else {
            btnDelete.classList.add('d-none');
        }
    }

    function confirmDeleteSingle(event, url) {
        event.preventDefault();

        Swal.fire({
            title: 'Xác nhận xóa phim?',
            text: "Dữ liệu bộ phim này sẽ bị xóa vĩnh viễn khỏi cơ sở dữ liệu hệ thống!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'Đồng ý xóa',
            cancelButtonText: 'Hủy bỏ',
            borderRadius: '16px'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = url;
            }
        });
    }

    function deleteSelectedMovies() {
        const currentCount = document.getElementById('selectCount').innerText;

        Swal.fire({
            title: 'Xóa hàng loạt các mục chọn?',
            text: `Bạn có chắc chắn muốn xóa đồng thời cả ${currentCount} bộ phim đã tích chọn? Hành động này không thể phục hồi!`,
            icon: 'error',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'Xác nhận xóa hết!',
            cancelButtonText: 'Quay lại',
            borderRadius: '16px'
        }).then((result) => {
            if (result.isConfirmed) {
                document.getElementById('bulkDeleteForm').submit();
            }
        });
    }
</script>
</body>
</html>
