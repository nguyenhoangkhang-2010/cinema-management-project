<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Thể Loại</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
</head>
<body>
<div class="admin-container">
    <div th:replace="~{admin/sidebar :: sidebar('categories')}"></div>

    <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
            <div class="d-flex align-items-center">
                <h4 class="m-0 fw-bold text-dark"><i class="bi bi-pencil-square text-primary me-2"></i>Cập Nhật Thể Loại</h4>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="row">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4">
                            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                            <form th:action="@{'/admin/categories/edit/' + *{maTheLoai}}" th:object="${categoryDTO}" method="post">
                                <input type="hidden" th:field="*{maTheLoai}"/>

                                <div class="mb-4">
                                    <label class="form-label fw-bold text-secondary">Tên thể loại <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{tenLoai}" placeholder="VD: Hành động, Kinh dị..." required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tenLoai')}" th:errors="*{tenLoai}"></div>
                                </div>

                                <hr class="my-4">
                                <div class="d-flex justify-content-end">
                                    <a th:href="@{/admin/categories}" class="btn btn-secondary fw-bold me-2">Hủy bỏ</a>
                                    <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-floppy me-1"></i> Cập Nhật Thể Loại</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
