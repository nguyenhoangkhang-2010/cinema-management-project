<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Thể Loại Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-primary text-white py-3 rounded-top-4">
                        <h5 class="mb-0 fw-bold">Thêm Thể Loại Mới</h5>
                    </div>
                    <div class="card-body p-4">

                        <!-- Tích hợp SweetAlert2 -->
                        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
                        <script th:inline="javascript">
                            document.addEventListener('DOMContentLoaded', function () {
                                const errorMsg = /*[[${error}]]*/ null;
                                if (errorMsg) {
                                    Swal.fire({
                                        icon: 'error', title: 'Lưu thất bại!', text: errorMsg,
                                        confirmButtonColor: '#0d6efd'
                                    });
                                }
                            });
                        </script>

                        <form th:action="@{/admin/categories/add}" 
                              th:object="${categoryDTO}" method="post">
                            
                            <input type="hidden" th:field="*{maTheLoai}"/>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Tên thể loại <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{tenLoai}" placeholder="VD: Hành động, Kinh dị..." required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tenLoai')}" th:errors="*{tenLoai}"></div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/categories}" class="btn btn-light border fw-bold">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary fw-bold px-4">Lưu Dữ Liệu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
