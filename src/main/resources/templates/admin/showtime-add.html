<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Suất Chiếu - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
</head>
<body>
<div class="admin-container">
    <div th:replace="~{admin/sidebar :: sidebar('showtimes')}"></div>
    <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
            <h4 class="m-0 fw-bold text-primary"><i class="bi bi-calendar-plus me-2"></i>Thêm Suất Chiếu</h4>
        </nav>
        <div class="container-fluid p-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form th:action="@{/admin/showtimes/add}" th:object="${showtime}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Chọn Phim</label>
                                <select class="form-select" th:field="*{maPhim}" required>
                                    <option value="">-- Chọn Phim --</option>
                                    <option th:each="m : ${movies}" th:value="${m.maPhim}" th:text="${m.tenPhim}"></option>
                                </select>
                                <div class="text-danger small" th:errors="*{maPhim}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Chọn Phòng</label>
                                <select class="form-select" th:field="*{maPhong}" required>
                                    <option value="">-- Chọn Phòng --</option>
                                    <option th:each="r : ${rooms}" th:value="${r.maPhong}" th:text="${r.tenPhong}"></option>
                                </select>
                                <div class="text-danger small" th:errors="*{maPhong}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Ngày Chiếu</label>
                                <input type="date" class="form-control" th:field="*{ngayChieu}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Giờ Bắt Đầu</label>
                                <input type="time" class="form-control" th:field="*{gioBatDau}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Giờ Kết Thúc</label>
                                <input type="time" class="form-control" th:field="*{gioKetThuc}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Giá Vé (VNĐ)</label>
                                <input type="number" class="form-control" th:field="*{giaVe}" required>
                                <div class="text-danger small" th:errors="*{giaVe}"></div>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <a th:href="@{/admin/showtimes}" class="btn btn-secondary me-2">Hủy Bỏ</a>
                            <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-floppy me-1"></i> Lưu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div></body></html>
