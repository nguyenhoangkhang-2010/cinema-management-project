<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Rạp Phim - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
    <link rel="stylesheet" th:href="@{/css/admin-common.css}">
</head>
<body>
    <div class="admin-container">
        <div th:replace="~{admin/sidebar :: sidebar('cinemas')}"></div>
        <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <h4 class="m-0 fw-bold text-primary"><i class="bi bi-building me-2"></i>Quản Lý Rạp Phim</h4>
            </nav>
            <div class="container-fluid p-4">
                
                <!-- Tích hợp SweetAlert2 -->
                <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
                <script th:inline="javascript">
                    document.addEventListener('DOMContentLoaded', function () {
                        const successMsg = /*[[${success}]]*/ null;
                        const errorMsg = /*[[${error}]]*/ null;
                        const hasCinemaData = /*[[${cinema != null}]]*/ false;

                        if (successMsg) {
                            Swal.fire({
                                icon: 'success',
                                title: 'Thành công!',
                                text: successMsg,
                                showConfirmButton: false,
                                timer: 2500,
                                toast: true,
                                position: 'top-end'
                            });
                        }

                        if (errorMsg) {
                            Swal.fire({
                                icon: 'error',
                                title: 'Lưu thất bại!',
                                text: errorMsg,
                                confirmButtonColor: '#0d6efd'
                            });
                            
                            // Tự động mở lại modal và giữ nguyên dữ liệu nếu có lỗi validation
                            if (hasCinemaData) {
                                document.getElementById('modalTitle').innerText = 'Kiểm Tra Lại Thông Tin Rạp';
                                new bootstrap.Modal(document.getElementById('cinemaModal')).show();
                            }
                        }
                    });
                </script>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <form th:action="@{/admin/cinemas}" method="get" class="d-flex gap-2">
                        <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Tìm tên rạp, địa chỉ...">
                        <button type="submit" class="btn btn-dark"><i class="bi bi-search"></i> Lọc</button>
                        <a th:href="@{/admin/cinemas}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></a>
                    </form>
                    <!-- Button trigger modal thêm mới -->
                    <button type="button" class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#cinemaModal" onclick="resetForm()">
                        <i class="bi bi-plus-circle me-1"></i> Thêm Rạp Chiếu Mới
                    </button>
                </div>

                <div class="card border-0 shadow-sm table-container">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4 py-3">Mã Rạp</th>
                                    <th>Tên Rạp Phim</th>
                                    <th>Địa Chỉ</th>
                                    <th>Số Điện Thoại</th>
                                    <th>Số Lượng Phòng</th>
                                    <th class="pe-4 text-end">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${cinemas.empty}">
                                    <td colspan="6" class="text-center py-4">Không có rạp phim nào</td>
                                </tr>
                                <tr th:each="c : ${cinemas.content}">
                                    <td class="ps-4 fw-bold text-secondary">#[[${c.maRap}]]</td>
                                    <td class="fw-bold text-dark">[[${c.tenRap}]]</td>
                                    <td>[[${c.diaChi}]]</td>
                                    <td>[[${c.soDienThoai}]]</td>
                                    <td><span class="badge bg-info text-dark">[[${c.soLuongPhong}]] Phòng</span></td>
                                    <td class="pe-4 text-end">
                                        <button type="button" class="btn btn-sm btn-outline-primary btn-action me-1" 
                                                th:attr="onclick='editCinema(' + ${c.maRap} + ', \'' + ${c.tenRap} + '\', \'' + ${c.diaChi} + '\', \'' + ${c.soDienThoai} + '\', ' + ${c.soLuongPhong} + ')'">
                                            <i class="bi bi-pencil-square"></i> Sửa
                                        </button>
                                        <a th:href="@{/admin/cinemas/delete/{id}(id=${c.maRap})}" class="btn btn-sm btn-outline-danger btn-action" th:onclick="confirmDeleteAction(event, this.href, 'Xóa rạp phim?', 'Bạn có chắc chắn muốn xóa rạp phim này không? Mọi phòng chiếu trực thuộc cũng sẽ bị xóa.')">
                                            <i class="bi bi-trash"></i> Xóa
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-center mt-4" th:if="${cinemas.totalPages > 1}">
                    <nav>
                        <ul class="pagination pagination-sm">
                            <li class="page-item" th:classappend="${cinemas.number == 0 ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/cinemas(page=${cinemas.number}, search=${search})}">&laquo;</a></li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(1, cinemas.totalPages)}" th:classappend="${cinemas.number == i - 1 ? 'active' : ''}"><a class="page-link" th:href="@{/admin/cinemas(page=${i}, search=${search})}" th:text="${i}"></a></li>
                            <li class="page-item" th:classappend="${cinemas.number == cinemas.totalPages - 1 ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/cinemas(page=${cinemas.number + 2}, search=${search})}">&raquo;</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Rạp Phim -->
    <div class="modal fade" id="cinemaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <form th:action="@{/admin/cinemas/save}" th:object="${cinemaDTO}" method="post" onsubmit="if(!document.getElementById('maRap').value) document.getElementById('maRap').disabled = true;">
                    <div class="modal-header bg-primary text-white rounded-top-4">
                        <h5 class="modal-title fw-bold" id="modalTitle">Thêm Rạp Phim Mới</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="maRap" th:field="*{maRap}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên Rạp Phim <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="tenRap" th:field="*{tenRap}" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tenRap')}" th:errors="*{tenRap}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Địa Chỉ</label>
                            <input type="text" class="form-control" id="diaChi" th:field="*{diaChi}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('diaChi')}" th:errors="*{diaChi}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số Điện Thoại</label>
                            <input type="text" class="form-control" id="soDienThoai" th:field="*{soDienThoai}" pattern="^(0[0-9]{9,10})$" title="Vui lòng nhập 10-11 số">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số Lượng Phòng</label>
                            <input type="number" class="form-control bg-light" id="soLuongPhong" th:field="*{soLuongPhong}" readonly>
                            <small class="text-muted fst-italic">Được hệ thống tự động tính toán từ Quản Lý Phòng Chiếu.</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-floppy me-1"></i> Lưu Rạp Phim</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function editCinema(maRap, tenRap, diaChi, soDienThoai, soLuongPhong) {
            document.getElementById('modalTitle').innerText = 'Cập Nhật Thông Tin Rạp';
            document.getElementById('maRap').value = maRap;
            document.getElementById('tenRap').value = tenRap;
            document.getElementById('diaChi').value = diaChi !== 'null' ? diaChi : '';
            document.getElementById('soDienThoai').value = soDienThoai !== 'null' ? soDienThoai : '';
            document.getElementById('soLuongPhong').value = soLuongPhong;
            new bootstrap.Modal(document.getElementById('cinemaModal')).show();
        }
        function resetForm() {
            document.getElementById('modalTitle').innerText = 'Thêm Rạp Phim Mới';
            document.getElementById('maRap').value = '';
            document.getElementById('tenRap').value = '';
            document.getElementById('diaChi').value = '';
            document.getElementById('soDienThoai').value = '';
            document.getElementById('soLuongPhong').value = '0';
        }

        function confirmDeleteAction(event, url, titleText, messageText) {
            event.preventDefault();
            Swal.fire({
                title: titleText,
                text: messageText,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Đồng ý xóa',
                cancelButtonText: 'Hủy bỏ',
                borderRadius: '16px'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = url;
                }
            });
        }
    </script>
</body>
</html>
