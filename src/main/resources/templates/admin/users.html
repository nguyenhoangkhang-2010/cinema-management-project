<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Khách Hàng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
</head>
<body>
    <div class="admin-container">
        
        <!-- CỘT BÊN TRÁI: SIDEBAR MENU -->
        <div th:replace="~{admin/sidebar :: sidebar('users')}"></div>

        <!-- CỘT BÊN PHẢI: NỘI DUNG CHÍNH -->
        <div class="w-100 flex-grow-1 d-flex flex-column">
            <!-- Header -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <div class="d-flex align-items-center">
                    <h4 class="m-0 fw-bold text-primary">Quản Lý Khách Hàng Đăng Nhập</h4>
                </div>
            </nav>

            <!-- Bảng danh sách Khách Hàng -->
            <div class="container-fluid p-4">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4 py-3 rounded-top-left">ID</th>
                                    <th>Họ Tên</th>
                                    <th>Email</th>
                                    <th>Trạng Thái Đăng Nhập</th>
                                    <th class="text-end pe-4 rounded-top-right">Thao Tác (Khóa/Mở)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Ví dụ Render danh sách user -->
                                <tr th:each="user : ${users}">
                                    <td class="ps-4 fw-bold text-secondary" th:text="${user.id}">1</td>
                                    <td class="fw-semibold text-dark" th:text="${user.hoTen}">Người dùng Demo</td>
                                    <td th:text="${user.email}">user@example.com</td>
                                    <td>
                                        <span class="badge bg-success" th:if="${user.hoatDong}">Đang Hoạt Động</span>
                                        <span class="badge bg-danger" th:if="${!user.hoatDong}">Bị Khóa</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <form th:action="@{/admin/users/toggle-lock/{id}(id=${user.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm" th:classappend="${user.hoatDong} ? 'btn-outline-danger' : 'btn-outline-success'">
                                                <i class="bi" th:classappend="${user.hoatDong} ? 'bi-lock-fill' : 'bi-unlock-fill'"></i>
                                                <span th:text="${user.hoatDong} ? 'Khóa User' : 'Mở Khóa'">Khóa User</span>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
