<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Người Dùng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
    <link rel="stylesheet" th:href="@{/css/admin-common.css}">
</head>
<body>
    <div class="admin-container">
        <div th:replace="~{admin/sidebar :: sidebar('users')}"></div>
        <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <h4 class="m-0 fw-bold text-primary"><i class="bi bi-people me-2"></i>Quản Lý Người Dùng</h4>
            </nav>
            <div class="container-fluid p-4">

                <!-- Tích hợp SweetAlert2 để hiện thông báo -->
                <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
                <script th:inline="javascript">
                    document.addEventListener('DOMContentLoaded', function () {
                        const successMsg = /*[[${success}]]*/ null;
                        const errorMsg = /*[[${error}]]*/ null;
                        if (successMsg) {
                            Swal.fire({ icon: 'success', title: 'Thành công!', text: successMsg, showConfirmButton: false, timer: 2500, toast: true, position: 'top-end' });
                        }
                        if (errorMsg) {
                            Swal.fire({ icon: 'error', title: 'Thất bại!', text: errorMsg, confirmButtonColor: '#0d6efd' });
                        }
                    });
                </script>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <form th:action="@{/admin/users}" method="get" class="d-flex gap-2">
                        <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Họ Tên, Email...">
                        <button type="submit" class="btn btn-dark"><i class="bi bi-search"></i> Tìm kiếm</button>
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></a>
                    </form>
                </div>
                <div class="card border-0 shadow-sm table-container">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4 py-3">Họ Tên</th>
                                    <th>Email</th>
                                    <th>SĐT</th>
                                    <th>Vai Trò</th>
                                    <th>Loại Tài Khoản</th>
                                    <th>Trạng Thái</th>
                                    <th class="pe-4 text-end">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${users.empty}">
                                    <td colspan="7" class="text-center py-4">Không tìm thấy người dùng</td>
                                </tr>
                                <tr th:each="u : ${users}">
                                    <td class="ps-4 fw-bold text-dark" th:text="${u.hoTen}">Họ Tên</td>
                                    <td th:text="${u.email}">Email</td>
                                    <td th:text="${u.soDienThoai}">SĐT</td>
                                    <td><span class="badge bg-primary" th:text="${u.vaiTro}">User</span></td>
                                    <td><span class="badge bg-info text-dark" th:text="${u.loaiTaiKhoan}">Thường</span></td>
                                    <td>
                                        <span class="badge" th:classappend="${u.trangThai == 'HoatDong' ? 'bg-success' : 'bg-danger'}" th:text="${u.trangThai}">Trạng Thái</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <form th:action="@{/admin/users/toggle-lock}" method="post" class="d-inline">
                                            <input type="hidden" name="email" th:value="${u.email}">
                                            <button type="submit" class="btn btn-sm btn-action" th:classappend="${u.trangThai == 'HoatDong' ? 'btn-outline-danger' : 'btn-outline-success'}">
                                                <i class="bi" th:classappend="${u.trangThai == 'HoatDong' ? 'bi-lock' : 'bi-unlock'}"></i>
                                                <span th:text="${u.trangThai == 'HoatDong' ? 'Khóa' : 'Mở Khóa'}"></span>
                                            </button>
                                        </form>
                                        <button type="button" class="btn btn-sm btn-outline-warning btn-action ms-1" th:attr="onclick='openRoleModal(\'' + ${u.email} + '\', \'' + ${u.vaiTro} + '\')'">
                                            <i class="bi bi-shield-lock"></i> Phân Quyền
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Phân Quyền -->
    <div class="modal fade" id="roleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <form th:action="@{/admin/users/change-role}" method="post">
                    <div class="modal-header bg-warning text-dark rounded-top-4">
                        <h5 class="modal-title fw-bold"><i class="bi bi-shield-lock me-2"></i>Phân Quyền Người Dùng</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="roleEmail" name="email">
                        <p class="mb-3 text-secondary">Đang cấp quyền cho tài khoản: <strong id="roleEmailDisplay" class="text-dark"></strong></p>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chọn Vai Trò <span class="text-danger">*</span></label>
                            <select class="form-select" id="roleSelect" name="role" required>
                                <option value="User">Người Dùng Cơ Bản (User)</option>
                                <option value="Admin">Quản Trị Viên (Admin)</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-warning fw-bold">Xác Nhận Đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function openRoleModal(email, currentRole) {
            document.getElementById('roleEmail').value = email;
            document.getElementById('roleEmailDisplay').innerText = email;
            const select = document.getElementById('roleSelect');
            if (currentRole && currentRole.toUpperCase().includes('ADMIN')) {
                select.value = 'Admin';
            } else {
                select.value = 'User';
            }
            new bootstrap.Modal(document.getElementById('roleModal')).show();
        }
    </script>
</body>
</html>
