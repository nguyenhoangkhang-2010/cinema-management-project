<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Hệ Thống Quản Trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
</head>
<body>
    <div class="admin-container">
        
        <!-- CỘT BÊN TRÁI: SIDEBAR MENU (Tái sử dụng bằng Fragment) -->
        <div th:replace="~{admin/sidebar :: sidebar('dashboard')}"></div>

        <!-- CỘT BÊN PHẢI: NỘI DUNG CHÍNH -->
        <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <div class="d-flex align-items-center">
                    <h4 class="m-0 fw-bold text-primary"><i class="bi bi-speedometer2 me-2"></i>Thống Kê Doanh Thu & Hệ Thống</h4>
                </div>
                <div class="ms-auto d-flex align-items-center">
                    <span class="me-3 fw-medium text-secondary">Xin chào, <b class="text-dark">Quản Trị Viên</b></span>
                </div>
            </nav>

            <div class="container-fluid p-4">
                <div class="row g-4 mb-4 row-cols-1 row-cols-md-5">
                    <!-- Thẻ Thống Kê -->
                    <div class="col">
                        <div class="card border-0 shadow-sm bg-primary text-white h-100 rounded-4">
                            <div class="card-body p-4">
                                <h6 class="text-uppercase mb-3 opacity-75 fw-bold">Tổng Phim</h6>
                                <h2 class="display-6 fw-bold" th:text="${admin.totalMovies}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card border-0 shadow-sm bg-info text-white h-100 rounded-4">
                            <div class="card-body p-4">
                                <h6 class="text-uppercase mb-3 opacity-75 fw-bold">Tổng Khách Hàng</h6>
                                <h2 class="display-6 fw-bold" th:text="${admin.totalUsers}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card border-0 shadow-sm bg-warning text-white h-100 rounded-4">
                            <div class="card-body p-4">
                                <h6 class="text-uppercase mb-3 opacity-75 fw-bold">Tổng Vé Đã Bán</h6>
                                <h2 class="display-6 fw-bold" th:text="${admin.totalTickets}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card border-0 shadow-sm bg-success text-white h-100 rounded-4">
                            <div class="card-body p-4">
                                <h6 class="text-uppercase mb-3 opacity-75 fw-bold">Tổng Doanh Thu</h6>
                                <h2 class="display-6 fw-bold" th:text="${#numbers.formatDecimal(admin.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card border-0 shadow-sm bg-danger text-white h-100 rounded-4">
                            <div class="card-body p-4">
                                <h6 class="text-uppercase mb-3 opacity-75 fw-bold">Chương Trình Khuyến Mãi</h6>
                                <h2 class="display-6 fw-bold" th:text="${admin.totalPromotions}">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BIỂU ĐỒ THỐNG KÊ (CHART.JS) -->
                <div class="row g-4">
                    <div class="col-md-8">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-body p-4">
                                <h5 class="fw-bold mb-4 text-primary">Biểu Đồ Doanh Thu (Theo Tháng)</h5>
                                <!-- Thêm box giới hạn chiều cao giúp Chart hiển thị mượt và responsive -->
                                <div style="height: 320px; position: relative;">
                                    <canvas id="revenueBarChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4 h-100">
                            <div class="card-body p-4 d-flex flex-column justify-content-center">
                                <h5 class="fw-bold mb-4 text-center text-primary">Doanh Thu Theo Giới Tính</h5>
                                <div style="height: 250px; position: relative; margin: 0 auto;">
                                    <canvas id="genderRevenuePieChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Nhúng thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Vẽ Bar Chart cho Doanh Thu theo tháng
            fetch('/admin/api/chart-data/doanhthu-thang')
                .then(response => response.json())
                .then(data => {
                    const ctxBar = document.getElementById('revenueBarChart').getContext('2d');
                    new Chart(ctxBar, {
                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Doanh Thu (VNĐ)',
                                data: data.values,
                                backgroundColor: 'rgba(13, 110, 253, 0.85)',
                                hoverBackgroundColor: '#0a58ca',
                                borderRadius: 6,
                                barPercentage: 0.6
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0,0,0,0.8)',
                                    titleFont: { size: 14 },
                                    bodyFont: { size: 14, weight: 'bold' }
                                }
                            },
                            scales: {
                                y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)', borderDash: [5, 5] } },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                });

            // 2. Vẽ Pie Chart cho Doanh Thu Theo Giới Tính
            fetch('/admin/api/chart-data/doanhthu-gioitinh')
                .then(response => response.json())
                .then(data => {
                    const ctxPie = document.getElementById('genderRevenuePieChart').getContext('2d');
                    new Chart(ctxPie, {
                        type: 'doughnut', /* Đổi sang dạng khuyên (Doughnut) hiện đại hơn Pie */
                        data: {
                            labels: data.labels,
                            datasets: [{
                                data: data.values,
                                backgroundColor: ['#0d6efd', '#d63384', '#6c757d'], // Xanh biển (Nam), Hồng (Nữ), Xám (Khác)
                                hoverOffset: 4,
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '65%',
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { padding: 20, font: { family: "'Segoe UI', sans-serif", weight: '600' } }
                                }
                            }
                        }
                    });
                });
        });
    </script>
</body>
</html>
