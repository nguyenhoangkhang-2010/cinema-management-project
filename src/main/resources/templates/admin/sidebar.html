<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div th:fragment="sidebar(activeMenu)" class="admin-sidebar d-flex flex-column vh-100 position-sticky top-0">
        
        <!-- Logo / Thương Hiệu -->
        <a th:href="@{/admin/dashboard}" class="sidebar-brand fw-bold text-decoration-none text-white d-block">
            <i class="bi bi-camera-reels-fill text-warning me-1"></i>Cinema <span class="text-warning">All Star</span>
        </a>
        
        <!-- Menu Điều Hướng -->
        <ul class="sidebar-menu list-unstyled my-3">
            <li th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            </li>
            <li th:classappend="${activeMenu == 'cinemas' ? 'active' : ''}">
                <a th:href="@{/admin/cinemas}"><i class="bi bi-building me-2"></i> Quản Lý Rạp Phim</a>
            </li>
            <li th:classappend="${activeMenu == 'movies' ? 'active' : ''}">
                <a th:href="@{/admin/movies}"><i class="bi bi-film me-2"></i> Quản Lý Phim</a>
            </li>
            <li th:classappend="${activeMenu == 'categories' ? 'active' : ''}">
                <a th:href="@{/admin/categories}"><i class="bi bi-tags-fill me-2"></i> Quản Lý Thể Loại</a>
            </li>
            <li th:classappend="${activeMenu == 'showtimes' ? 'active' : ''}">
                <a th:href="@{/admin/showtimes}"><i class="bi bi-calendar3 me-2"></i> Quản Lý Suất Chiếu</a>
            </li>
            <li th:classappend="${activeMenu == 'rooms' ? 'active' : ''}">
                <a th:href="@{/admin/rooms}"><i class="bi bi-door-open me-2"></i> Quản Lý Phòng Chiếu</a>
            </li>
            <li th:classappend="${activeMenu == 'bookings' ? 'active' : ''}">
                <a th:href="@{/admin/bookings}"><i class="bi bi-bookmark-check me-2"></i> Quản Lý Vé Đã Đặt</a>
            </li>
            <li th:classappend="${activeMenu == 'payments' ? 'active' : ''}">
                <a th:href="@{/admin/payments}"><i class="bi bi-credit-card me-2"></i> Quản Lý Thanh Toán</a>
            </li>
            <li th:classappend="${activeMenu == 'users' ? 'active' : ''}">
                <a th:href="@{/admin/users}"><i class="bi bi-people me-2"></i> Quản Lý Người Dùng</a>
            </li>
            <li th:classappend="${activeMenu == 'promotions' ? 'active' : ''}">
                <a th:href="@{/admin/promotions}"><i class="bi bi-gift me-2"></i> Quản Lý Khuyến Mãi</a>
            </li>
        </ul>

        <!-- Nút Trở Về Trang Chủ Ở Dưới Cùng -->
        <div class="mt-auto p-3 mb-3">
            <a th:href="@{/}" class="btn btn-warning w-100 fw-bold shadow-sm rounded-3">
                <i class="bi bi-house-door me-2 text-dark"></i><span class="text-dark">Về Trang Chủ</span>
            </a>
        </div>
        
    </div>
</body>
</html>
