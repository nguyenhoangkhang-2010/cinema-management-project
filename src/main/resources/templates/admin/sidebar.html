<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Khai báo Fragment có tên là 'sidebar' và nhận 1 tham số 'activePage' -->
    <div class="admin-sidebar d-flex flex-column" th:fragment="sidebar(activePage)">
        <div class="sidebar-brand text-center py-4 fs-4 fw-bolder text-uppercase border-bottom" style="border-color: rgba(255,255,255,0.1) !important; letter-spacing: 2px;">
            <i class="bi bi-camera-reels-fill text-warning me-2"></i><span class="text-light">ALL STAR</span>
        </div>
        
        <div class="p-3 flex-grow-1">
            <div class="text-uppercase text-info small fw-bold mb-2 ps-3" style="letter-spacing: 1px;">Bảng Điều Khiển</div>
            <ul class="sidebar-menu list-unstyled mb-4">
                <li th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                    <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-3 fs-5"></i><span>Tổng Quan</span></a>
                </li>
                <li th:classappend="${activePage == 'movies'} ? 'active' : ''">
                    <a th:href="@{/admin/movies}">
                        <i class="bi bi-film me-3 fs-5"></i><span>Quản Lý Phim</span>
                        <span th:if="${admin != null}" class="badge bg-primary rounded-pill" th:text="${admin.totalMovies != null ? admin.totalMovies : 0}">0</span>
                    </a>
                </li>
                <li th:classappend="${activePage == 'tickets'} ? 'active' : ''">
                    <a href="#"><i class="bi bi-ticket-perforated me-3 fs-5"></i><span>Vé & Suất Chiếu</span></a>
                </li>
            </ul>
            
            <div class="text-uppercase text-info small fw-bold mb-2 ps-3 mt-4" style="letter-spacing: 1px;">Kinh Doanh</div>
            <ul class="sidebar-menu list-unstyled mb-4">
                <li th:classappend="${activePage == 'rooms'} ? 'active' : ''">
                    <a href="#"><i class="bi bi-shop-window me-3 fs-5"></i><span>Rạp & Phòng</span></a>
                </li>
                <li th:classappend="${activePage == 'promotions'} ? 'active' : ''">
                    <a th:href="@{/admin/promotions}">
                        <i class="bi bi-gift me-3 fs-5"></i><span>Khuyến Mãi</span>
                        <span th:if="${admin != null}" class="badge bg-danger rounded-pill" th:text="${admin.totalPromotions != null ? admin.totalPromotions : 0}">0</span>
                    </a>
                </li>
                <li th:classappend="${activePage == 'users'} ? 'active' : ''">
                    <a th:href="@{/admin/users}"><i class="bi bi-people me-3 fs-5"></i><span>Khách Hàng</span></a>
                </li>
            </ul>
        </div>

        <!-- Nút Trở Về Trang Khách -->
        <div class="px-3 mb-3">
            <a th:href="@{/}" class="btn btn-warning w-100 fw-bold shadow-sm rounded-3">
                <i class="bi bi-box-arrow-left me-2 text-dark"></i><span class="text-dark">Trở Về Trang Khách</span>
            </a>
        </div>

        <!-- Widget Thông tin Admin -->
        <div class="w-100 p-3 border-top" style="border-color: rgba(255,255,255,0.1) !important; background-color: rgba(0,0,0,0.2);">
            <div class="d-flex align-items-center px-2">
                <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center fw-bold me-3" style="width: 40px; height: 40px;">AD</div>
                <div>
                    <h6 class="mb-0 text-white fw-bold" style="font-size: 0.95rem;">Admin Tối Cao</h6>
                    <small class="text-warning fw-medium" style="font-size: 0.75rem;"><i class="bi bi-circle-fill text-success me-1" style="font-size: 8px;"></i>Đang hoạt động</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
