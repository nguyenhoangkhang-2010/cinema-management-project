<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Suất Chiếu - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
    <link rel="stylesheet" th:href="@{/css/admin-common.css}">
</head>
<body>
    <div class="admin-container">
        <div th:replace="~{admin/sidebar :: sidebar('showtimes')}"></div>
        <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <h4 class="m-0 fw-bold text-primary"><i class="bi bi-calendar3 me-2"></i>Quản Lý Suất Chiếu</h4>
            </nav>
            <div class="container-fluid p-4">

                <!-- Tích hợp SweetAlert2 -->
                <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
                <script th:inline="javascript">
                    document.addEventListener('DOMContentLoaded', function () {
                        const successMsg = /*[[${success}]]*/ null;
                        const errorMsg = /*[[${error}]]*/ null;

                        if (successMsg) {
                            Swal.fire({
                                icon: 'success', title: 'Thành công!', text: successMsg,
                                showConfirmButton: false, timer: 2500, toast: true, position: 'top-end'
                            });
                        }

                        if (errorMsg) {
                            Swal.fire({
                                icon: 'error', title: 'Thất bại!', text: errorMsg,
                                confirmButtonColor: '#0d6efd'
                            });
                        }
                    });
                </script>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <form th:action="@{/admin/showtimes}" method="get" class="d-flex gap-2">
                        <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Tên phim...">
                        <input type="date" name="ngayChieu" th:value="${ngayChieu}" class="form-control">
                        <button type="submit" class="btn btn-dark"><i class="bi bi-search"></i> Lọc</button>
                        <a th:href="@{/admin/showtimes}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></a>
                    </form>
                    <button type="button" class="btn btn-primary fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#showtimeModal" onclick="resetForm()">
                        <i class="bi bi-plus-circle me-1"></i> Thêm Suất Chiếu
                    </button>
                </div>

                <div class="card border-0 shadow-sm table-container">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4 py-3">Mã SC</th>
                                    <th>Phim</th>
                                    <th>Phòng Chiếu</th>
                                    <th>Ngày Chiếu</th>
                                    <th>Thời Gian</th>
                                    <th>Giá Vé</th>
                                    <th class="pe-4 text-end">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${showtimes.empty}">
                                    <td colspan="7" class="text-center py-4">Không có dữ liệu</td>
                                </tr>
                                <tr th:each="st : ${showtimes.content}">
                                    <td class="ps-4 fw-bold text-secondary" th:text="${st.maSuatChieu}">1</td>
                                    <td class="fw-bold text-dark" th:text="${st.tenPhim}">Phim</td>
                                    <td th:text="${st.tenPhong}">Phòng</td>
                                    <td th:text="${#temporals.format(st.ngayChieu, 'dd/MM/yyyy')}">Date</td>
                                    <td>
                                        <span class="badge bg-info text-dark" th:text="${st.gioBatDau}">10:00</span> - <span class="badge bg-secondary" th:text="${st.gioKetThuc}">12:00</span>
                                    </td>
                                    <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(st.giaVe, 0, 'COMMA', 0, 'POINT')} + ' đ'">50,000 đ</td>
                                    <td class="text-end pe-4">
                                        <button type="button" class="btn btn-sm btn-outline-primary btn-action me-1" th:attr="onclick='editShowtime(' + ${st.maSuatChieu} + ')'">
                                            <i class="bi bi-pencil-square"></i> Sửa
                                        </button>
                                        <a th:href="@{/admin/showtimes/delete/{id}(id=${st.maSuatChieu})}" class="btn btn-sm btn-outline-danger btn-action" th:onclick="confirmDeleteAction(event, this.href, 'Xóa suất chiếu?', 'Hành động này không thể hoàn tác!')"><i class="bi bi-trash"></i> Xóa</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="d-flex justify-content-center mt-4" th:if="${showtimes.totalPages > 1}">
                    <nav>
                        <ul class="pagination pagination-sm">
                            <li class="page-item" th:classappend="${showtimes.number == 0 ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/showtimes(page=${showtimes.number}, search=${search}, ngayChieu=${ngayChieu})}">&laquo;</a></li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(1, showtimes.totalPages)}" th:classappend="${showtimes.number == i - 1 ? 'active' : ''}"><a class="page-link" th:href="@{/admin/showtimes(page=${i}, search=${search}, ngayChieu=${ngayChieu})}" th:text="${i}"></a></li>
                            <li class="page-item" th:classappend="${showtimes.number == showtimes.totalPages - 1 ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/showtimes(page=${showtimes.number + 2}, search=${search}, ngayChieu=${ngayChieu})}">&raquo;</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Suất Chiếu -->
    <div class="modal fade" id="showtimeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 border-0 shadow">
                <form th:action="@{/admin/showtimes/save}" th:object="${showtime}" method="post">
                    <div class="modal-header bg-primary text-white rounded-top-4">
                        <h5 class="modal-title fw-bold" id="modalTitle">Thêm Suất Chiếu</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="maSuatChieu" name="maSuatChieu">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Chọn Phim <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{maPhim}" required>
                                    <option value="">-- Chọn Phim --</option>
                                    <option th:each="m : ${movies}" th:value="${m.maPhim}" th:text="${m.tenPhim}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Chọn Phòng <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{maPhong}" required>
                                    <option value="">-- Chọn Phòng --</option>
                                    <option th:each="r : ${rooms}" th:value="${r.maPhong}" th:text="${r.tenPhong}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Ngày Chiếu <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" th:field="*{ngayChieu}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Giá Vé (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" th:field="*{giaVe}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Giờ Bắt Đầu <span class="text-danger">*</span></label>
                                <input type="time" class="form-control" th:field="*{gioBatDau}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Giờ Kết Thúc <span class="text-danger">*</span></label>
                                <input type="time" class="form-control" th:field="*{gioKetThuc}" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-floppy me-1"></i> Lưu Suất Chiếu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function editShowtime(id) {
            document.getElementById('modalTitle').innerText = 'Cập Nhật Suất Chiếu';
            document.getElementById('maSuatChieu').value = id;
            
            fetch(`/admin/showtimes/api/${id}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('maPhim').value = data.maPhim;
                    document.getElementById('maPhong').value = data.maPhong;
                    document.getElementById('ngayChieu').value = data.ngayChieu;
                    document.getElementById('gioBatDau').value = data.gioBatDau;
                    document.getElementById('gioKetThuc').value = data.gioKetThuc;
                    document.getElementById('giaVe').value = data.giaVe;
                    new bootstrap.Modal(document.getElementById('showtimeModal')).show();
                })
                .catch(err => {
                    console.error(err);
                    Swal.fire('Lỗi!', 'Không thể lấy dữ liệu suất chiếu.', 'error');
                });
        }

        function resetForm() {
            document.getElementById('modalTitle').innerText = 'Thêm Suất Chiếu';
            document.getElementById('maSuatChieu').value = '';
            document.getElementById('maPhim').value = '';
            document.getElementById('maPhong').value = '';
            document.getElementById('ngayChieu').value = '';
            document.getElementById('gioBatDau').value = '';
            document.getElementById('gioKetThuc').value = '';
            document.getElementById('giaVe').value = '';
        }

        function confirmDeleteAction(event, url, titleText, messageText) {
            event.preventDefault();
            Swal.fire({
                title: titleText,
                text: messageText,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Đồng ý xóa',
                cancelButtonText: 'Hủy bỏ',
                borderRadius: '16px'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = url;
                }
            });
        }
    </script>
</body>
</html>
