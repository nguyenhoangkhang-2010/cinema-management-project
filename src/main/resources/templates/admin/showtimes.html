<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Suất Chiếu - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
</head>
<body>
    <div class="admin-container">
        <div th:replace="~{admin/sidebar :: sidebar('showtimes')}"></div>
        <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <h4 class="m-0 fw-bold text-primary"><i class="bi bi-calendar3 me-2"></i>Quản Lý Suất Chiếu</h4>
            </nav>
            <div class="container-fluid p-4">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <form th:action="@{/admin/showtimes}" method="get" class="d-flex gap-2">
                        <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Tên phim...">
                        <input type="date" name="ngayChieu" th:value="${ngayChieu}" class="form-control">
                        <button type="submit" class="btn btn-dark"><i class="bi bi-search"></i> Lọc</button>
                        <a th:href="@{/admin/showtimes}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></a>
                    </form>
                    <a th:href="@{/admin/showtimes/add}" class="btn btn-primary fw-bold"><i class="bi bi-plus-circle me-1"></i> Thêm Suất Chiếu</a>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4 py-3">Mã SC</th>
                                    <th>Phim</th>
                                    <th>Phòng Chiếu</th>
                                    <th>Ngày Chiếu</th>
                                    <th>Thời Gian</th>
                                    <th>Giá Vé</th>
                                    <th class="pe-4 text-end">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${showtimes.empty}">
                                    <td colspan="7" class="text-center py-4">Không có dữ liệu</td>
                                </tr>
                                <tr th:each="st : ${showtimes.content}">
                                    <td class="ps-4 fw-bold text-secondary" th:text="${st.maSuatChieu}">1</td>
                                    <td class="fw-bold text-dark" th:text="${st.tenPhim}">Phim</td>
                                    <td th:text="${st.tenPhong}">Phòng</td>
                                    <td th:text="${#temporals.format(st.ngayChieu, 'dd/MM/yyyy')}">Date</td>
                                    <td>
                                        <span class="badge bg-info text-dark" th:text="${st.gioBatDau}">10:00</span> - <span class="badge bg-secondary" th:text="${st.gioKetThuc}">12:00</span>
                                    </td>
                                    <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(st.giaVe, 0, 'COMMA', 0, 'POINT')} + ' đ'">50,000 đ</td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/admin/showtimes/edit/{id}(id=${st.maSuatChieu})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil-square"></i></a>
                                        <a th:href="@{/admin/showtimes/delete/{id}(id=${st.maSuatChieu})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa suất chiếu này?');"><i class="bi bi-trash"></i></a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="d-flex justify-content-center mt-4" th:if="${showtimes.totalPages > 1}">
                    <nav>
                        <ul class="pagination pagination-sm">
                            <li class="page-item" th:classappend="${showtimes.number == 0 ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/showtimes(page=${showtimes.number}, search=${search}, ngayChieu=${ngayChieu})}">&laquo;</a></li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(1, showtimes.totalPages)}" th:classappend="${showtimes.number == i - 1 ? 'active' : ''}"><a class="page-link" th:href="@{/admin/showtimes(page=${i}, search=${search}, ngayChieu=${ngayChieu})}" th:text="${i}"></a></li>
                            <li class="page-item" th:classappend="${showtimes.number == showtimes.totalPages - 1 ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/showtimes(page=${showtimes.number + 2}, search=${search}, ngayChieu=${ngayChieu})}">&raquo;</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
