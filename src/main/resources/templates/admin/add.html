<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Khuyến Mãi - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
</head>
<body>
<div class="admin-container">

    <!-- CỘT BÊN TRÁI: SIDEBAR MENU -->
    <div th:replace="~{admin/sidebar :: sidebar('promotions')}"></div>

    <!-- CỘT BÊN PHẢI: NỘI DUNG CHÍNH -->
    <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
        <!-- Header -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
            <div class="d-flex align-items-center">
                <h4 class="m-0 fw-bold text-primary"><i class="bi bi-gift-fill me-2"></i>Thêm Khuyến Mãi Mới</h4>
            </div>
        </nav>

        <!-- Form thêm khuyến mãi -->
        <div class="container-fluid p-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form th:action="@{/admin/promotions/add}" th:object="${promotion}" method="post">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="tenKhuyenMai" class="form-label fw-bold">Tên Chương Trình Khuyến Mãi</label>
                                    <input type="text" class="form-control" id="tenKhuyenMai" th:field="*{tenKhuyenMai}" required>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="phanTramGiam" class="form-label fw-bold">Phần Trăm Giảm (%)</label>
                                        <input type="number" step="0.1" class="form-control" id="phanTramGiam" th:field="*{phanTramGiam}" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="trangThaiKhuyenMai" class="form-label fw-bold">Trạng Thái</label>
                                        <select class="form-select" id="trangThaiKhuyenMai" th:field="*{trangThaiKhuyenMai}" required>
                                            <option th:value="'HoatDong'" th:text="Hoạt động"></option>
                                            <option th:value="'Ngung'" th:text="Ngưng"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="ngayBatDau" class="form-label fw-bold">Ngày Bắt Đầu</label>
                                        <input type="date" class="form-control" id="ngayBatDau" th:field="*{ngayBatDau}" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="ngayKetThuc" class="form-label fw-bold">Ngày Kết Thúc</label>
                                        <input type="date" class="form-control" id="ngayKetThuc" th:field="*{ngayKetThuc}" required>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="poster" class="form-label fw-bold">URL Poster/Ảnh</label>
                                    <input type="text" class="form-control" id="poster" th:field="*{poster}" placeholder="https://example.com/image.jpg">
                                    <div class="text-center mt-3">
                                        <img src="https://placehold.co/600x400?text=Preview" class="img-fluid rounded" alt="Poster preview">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end">
                            <a th:href="@{/admin/promotions}" class="btn btn-secondary me-2">Hủy Bỏ</a>
                            <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-floppy me-1"></i> Lưu Khuyến Mãi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
