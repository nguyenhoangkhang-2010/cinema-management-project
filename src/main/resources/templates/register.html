<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành viên - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="container">
    <div class="row justify-content-center w-100">
        <div class="col-12 d-flex justify-content-center">

            <div class="card register-card p-4">
                <div class="text-center mb-3">
                    <h2 class="fw-bold text-white">Gia nhập <span class="text-warning">All Star</span></h2>
                    <p class="text-light-muted small mb-0">Đăng ký để nhận nhiều ưu đãi đặt vé hơn!</p>
                </div>

                <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

                <form th:action="@{/register}" th:object="${registerDTO}" method="post">
                    <div class="mb-3">
                        <label class="form-label small">Họ và Tên</label>
                        <input type="text" th:field="*{hoTen}" class="form-control" placeholder="Nguyễn Văn A" required>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="an@example.com" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small">Số điện thoại</label>
                            <input type="text" th:field="*{soDienThoai}" class="form-control" placeholder="09xxxxxxx">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Ngày sinh</label>
                        <input type="date" th:field="*{ngaySinh}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Mật khẩu</label>
                        <div class="input-group password-wrapper">
                            <input type="password" th:field="*{matKhau}" class="form-control" placeholder="••••••••" required>
                            <span class="input-group-text toggle-password" onclick="togglePass('matKhau', 'eyeIcon1')">
                                <i class="bi bi-eye-slash" id="eyeIcon1"></i>
                            </span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Xác nhận mật khẩu</label>
                        <div class="input-group password-wrapper">
                            <input type="password" th:field="*{nhapLaiMatKhau}" class="form-control" placeholder="••••••••" required>
                            <span class="input-group-text toggle-password" onclick="togglePass('nhapLaiMatKhau', 'eyeIcon2')">
                                <i class="bi bi-eye-slash" id="eyeIcon2"></i>
                            </span>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label small" for="terms">Tôi đồng ý với các điều khoản sử dụng.</label>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3">XÁC NHẬN ĐĂNG KÝ</button>

                    <p class="text-center small text-light-muted mb-0">
                        Đã có tài khoản?
                        <a th:href="@{/login}" class="text-warning fw-bold">Đăng nhập ngay</a>
                    </p>
                </form>
            </div>

        </div>
    </div>
</div>

<script>
    function togglePass(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("bi-eye-slash");
            eyeIcon.classList.add("bi-eye");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("bi-eye");
            eyeIcon.classList.add("bi-eye-slash");
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
