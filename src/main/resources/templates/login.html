<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="container">
    <div class="row justify-content-center w-100">
        <div class="col-12 d-flex justify-content-center">

            <div class="card login-card p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white">Cinema <span class="text-warning">All Star</span></h2>
                    <p class="text-light-muted small">Chào mừng bạn quay trở lại!</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger py-2 small text-center">
                    Email hoặc mật khẩu không chính xác!
                </div>
                <div th:if="${param.success}" class="alert alert-success py-2 small text-center">
                    Đăng ký thành công! Hãy đăng nhập.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label class="form-label small">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                            <span class="input-group-text toggle-password" onclick="togglePass('loginPassword', 'eyeIconLogin')" style="cursor: pointer;">
                                <i class="bi bi-eye-slash" id="eyeIconLogin"></i>
                            </span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check m-0">
                            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                            <label class="form-check-label small" for="rememberMe">Ghi nhớ tôi</label>
                        </div>
                        <a th:href="@{/}" class="small text-warning">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3">ĐĂNG NHẬP</button>

                    <p class="text-center small text-light-muted mb-0">
                        Bạn chưa có tài khoản?
                        <a th:href="@{/register}" class="text-warning fw-bold">Đăng ký ngay</a>
                    </p>
                </form>
            </div>

        </div>
    </div>
</div>

<div class="position-absolute bottom-0 mb-4 text-center w-100" style="z-index: 3;">
    <a th:href="@{/}" class="text-light-muted text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i> Quay lại trang chủ
    </a>
</div>

<script>
    function togglePass(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("bi-eye-slash");
            eyeIcon.classList.add("bi-eye");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("bi-eye");
            eyeIcon.classList.add("bi-eye-slash");
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
