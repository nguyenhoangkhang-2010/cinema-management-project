<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Phim Online - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="bg-light">

    <!-- Main Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Cinema <span class="text-warning">All Star</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang Chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Star Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Sự Kiện</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/khuyen-mai}">Khuyến Mãi</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" th:href="@{/phim-online}">Phim Online</a></li>
                </ul>
                
                <!-- GIAO DIỆN CHƯA ĐĂNG NHẬP -->
                <div sec:authorize="!isAuthenticated()" class="d-flex align-items-center">
                    <a th:href="@{/login}" class="btn btn-outline-dark fw-bold me-2 px-4">Đăng Nhập</a>
                    <a th:href="@{/register}" class="btn btn-warning fw-bold px-4">Đăng Ký</a>
                </div>
                
                <!-- GIAO DIỆN ĐÃ ĐĂNG NHẬP -->
                <div sec:authorize="isAuthenticated()" class="dropdown position-relative">
                    <div class="d-flex align-items-center avatar-circle-wrap ms-3" tabindex="0">
                        <i class="bi bi-person-fill fs-4 text-secondary"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end custom-profile-menu shadow-lg">
                        <li class="px-3 py-2 border-bottom mb-2 text-center bg-light rounded-top">
                            <span class="fw-bold d-block text-dark user-name-text" sec:authentication="name">Tên User</span>
                        </li>
                        <li><a class="dropdown-item py-2 fw-medium" th:href="@{/profile}"><i class="bi bi-person-lines-fill me-2 text-secondary"></i>Hồ Sơ Của Tôi</a></li>
                        <li><a class="dropdown-item py-2 fw-medium" href="#"><i class="bi bi-ticket-perforated me-2 text-secondary"></i>Lịch Sử Đặt Vé</a></li>
                        <li sec:authorize="hasRole('Admin')">
                            <a class="dropdown-item py-2 fw-bold text-primary" th:href="@{/admin/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i>Quản Lý Hệ Thống
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item py-2 fw-bold text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Đăng Xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0 border-start border-warning border-4 ps-3">Phim Đang Chiếu Trực Tuyến</h2>
            <!-- Nút Thêm Phim: Chỉ Admin mới thấy -->
            <a sec:authorize="hasRole('Admin')" th:href="@{/admin/movies/add}" class="btn btn-primary btn-sm fw-bold shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>Thêm phim mới
            </a>
        </div>
        
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <!-- Duyệt qua danh sách phim trạng thái Online -->
            <div class="col" th:each="movie : ${movies}">
                <div class="card movie-card h-100 position-relative">
                    <!-- Nút Sửa/Xóa Phim: Chỉ Admin mới thấy -->
                    <div sec:authorize="hasRole('Admin')" class="position-absolute top-0 end-0 m-2 z-3" style="z-index: 5;">
                        <a th:href="@{'/admin/movies/edit/' + ${movie.maPhim}}" class="btn btn-sm btn-light text-primary shadow-sm rounded-circle me-1" title="Sửa"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{'/admin/movies/delete/' + ${movie.maPhim}}" class="btn btn-sm btn-light text-danger shadow-sm rounded-circle" title="Xóa" onclick="return confirm('Xóa phim này?');"><i class="bi bi-trash-fill"></i></a>
                    </div>

                    <span class="online-badge"><i class="bi bi-play-circle-fill me-1"></i> ONLINE</span>
                    <img th:src="@{${movie.poster}}" class="card-img-top" alt="Poster phim" style="height: 350px; object-fit: cover;">
                    
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold text-truncate" th:text="${movie.tenPhim}">Tên Phim</h5>
                        <p class="card-text text-muted small mb-2">Đạo diễn: <span th:text="${movie.daoDien}"></span></p>
                        
                        <div class="mt-auto">
                            <!-- Đã đăng nhập: Hiện nút XEM NGAY -->
                            <a sec:authorize="isAuthenticated()" th:href="@{/watch/{id}(id=${movie.maPhim})}" class="btn btn-warning w-100 fw-bold">
                                <i class="bi bi-play-fill me-1"></i> XEM NGAY
                            </a>
                            <!-- Chưa đăng nhập: Yêu cầu Đăng Nhập -->
                            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-outline-dark w-100 fw-bold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> ĐĂNG NHẬP ĐỂ XEM
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
