<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Phim Online - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="bg-light">

    <!-- Nhúng Header Chuẩn -->
    <div th:replace="~{user/home :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0 border-start border-warning border-4 ps-3">Phim Đang Chiếu Trực Tuyến</h2>
            <!-- Nút Thêm Phim: Chỉ Admin mới thấy -->
            <a sec:authorize="hasRole('Admin')" th:href="@{/admin/movies/add}" class="btn btn-primary btn-sm fw-bold shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>Thêm phim mới
            </a>
        </div>
        
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <!-- Duyệt qua danh sách phim trạng thái Online -->
            <div class="col" th:each="movie : ${movies}">
                <div class="card movie-card h-100 position-relative">
                    <!-- Nút Sửa/Xóa Phim: Chỉ Admin mới thấy -->
                    <div sec:authorize="hasRole('Admin')" class="position-absolute top-0 end-0 m-2 z-3" style="z-index: 5;">
                        <a th:href="@{'/admin/movies/edit/' + ${movie.maPhim}}" class="btn btn-sm btn-light text-primary shadow-sm rounded-circle me-1" title="Sửa"><i class="bi bi-pencil-fill"></i></a>
                        <a th:href="@{'/admin/movies/delete/' + ${movie.maPhim}}" class="btn btn-sm btn-light text-danger shadow-sm rounded-circle" title="Xóa" th:onclick="confirmDeleteOnline(event, this.href)"><i class="bi bi-trash-fill"></i></a>
                    </div>

                    <span class="online-badge"><i class="bi bi-play-circle-fill me-1"></i> ONLINE</span>
                    <img th:src="@{${movie.poster}}" class="card-img-top" alt="Poster phim" style="height: 350px; object-fit: cover;">
                    
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold text-truncate" th:text="${movie.tenPhim}">Tên Phim</h5>
                        <p class="card-text text-muted small mb-2">Đạo diễn: <span th:text="${movie.daoDien}"></span></p>
                        
                        <div class="mt-auto">
                            <!-- Đã đăng nhập: Hiện nút XEM NGAY -->
                            <a sec:authorize="isAuthenticated()" th:href="@{/watch/{id}(id=${movie.maPhim})}" class="btn btn-warning w-100 fw-bold">
                                <i class="bi bi-play-fill me-1"></i> XEM NGAY
                            </a>
                            <!-- Chưa đăng nhập: Yêu cầu Đăng Nhập -->
                            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-outline-dark w-100 fw-bold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> ĐĂNG NHẬP ĐỂ XEM
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Load Script cho Mega Menu (Bắt buộc phải có để Menu Phim hiển thị data) -->
    <script th:replace="~{user/home :: megaMenuScript}"></script>
    <script>
        function confirmDeleteOnline(event, url) {
            event.preventDefault();
            Swal.fire({
                title: 'Xác nhận xóa phim?',
                text: "Dữ liệu bộ phim này sẽ bị xóa vĩnh viễn khỏi hệ thống!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Đồng ý xóa',
                cancelButtonText: 'Hủy bỏ',
                borderRadius: '16px'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = url;
                }
            });
        }
    </script>
</body>
</html>
