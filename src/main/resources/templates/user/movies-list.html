<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - Cinema All Star'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="bg-light">
    <!-- Nhúng Header Chuẩn -->
    <div th:replace="~{user/home :: nav}"></div>

    <div class="container py-5">
        <h2 class="fw-bold mb-4 border-start border-warning border-4 ps-3 text-uppercase" th:text="${pageTitle}"></h2>
        
        <!-- Filter Form -->
        <div class="card border-0 shadow-sm rounded-4 mb-5">
            <div class="card-body p-4">
                <form th:action="@{'/movies/' + ${type}}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-5"><label class="form-label fw-bold small text-muted">Tên phim</label><input type="text" name="search" th:value="${param.search}" class="form-control bg-light" placeholder="Nhập tên phim..."></div>
                    <div class="col-md-2"><label class="form-label fw-bold small text-muted">Quốc gia</label><input type="text" name="quocGia" th:value="${param.quocGia}" class="form-control bg-light" placeholder="VD: Mỹ"></div>
                    <div class="col-md-2"><label class="form-label fw-bold small text-muted">Độ tuổi</label><input type="number" name="doTuoi" th:value="${param.doTuoi}" class="form-control bg-light" placeholder="VD: 18"></div>
                    <div class="col-md-3"><button class="btn btn-warning w-100 fw-bold" type="submit"><i class="bi bi-funnel-fill me-1"></i> Lọc Kết Quả</button></div>
                </form>
            </div>
        </div>
        
        <!-- Grid Danh Sách Phim -->
        <div class="row row-cols-1 row-cols-md-4 g-4 mb-5">
            <div class="col" th:each="movie : ${moviePage.content}">
                <div class="card border-0 movie-card shadow-sm h-100 position-relative">
                    <img th:src="${movie.poster != null} ? ${movie.poster} : 'https://placehold.co/350x500'" class="card-img-top" style="height: 380px; object-fit: cover;">
                    <div class="card-body text-center p-3">
                        <h6 class="fw-bold text-dark text-truncate mb-1" th:text="${movie.tenPhim}"></h6>
                        <span class="text-muted small"><span th:text="${movie.quocGia}"></span> | <span th:text="${movie.thoiLuong}"></span>' | <span class="badge bg-secondary">T<span th:text="${movie.doTuoi}"></span></span></span>
                    </div>
                    <div class="card-hover-actions">
                        <a th:href="@{'/movies/detail/' + ${movie.maPhim}}" class="btn btn-outline-light fw-bold mb-2 w-75 rounded-pill">CHI TIẾT</a>
                        <a th:if="${movie.trangThai.name() == 'DangChieu'}" th:href="@{'/book/' + ${movie.maPhim}}" class="btn btn-danger fw-bold w-75 rounded-pill">ĐẶT VÉ</a>
                    </div>
                </div>
            </div>
            <div th:if="${moviePage.empty}" class="col-12 text-center text-muted py-5"><i class="bi bi-inbox fs-1"></i><p>Không tìm thấy phim nào phù hợp.</p></div>
        </div>
        
        <!-- Pagination -->
        <div class="d-flex justify-content-center" th:if="${moviePage.totalPages > 1}">
            <nav>
                <ul class="pagination shadow-sm">
                    <li class="page-item" th:classappend="${moviePage.first ? 'disabled' : ''}">
                        <a class="page-link text-dark" th:href="@{'/movies/' + ${type}(page=${moviePage.number}, search=${param.search}, quocGia=${param.quocGia}, doTuoi=${param.doTuoi})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, moviePage.totalPages)}" th:classappend="${moviePage.number == (i - 1) ? 'active bg-warning border-warning' : ''}">
                        <a class="page-link text-dark" th:href="@{'/movies/' + ${type}(page=${i}, search=${param.search}, quocGia=${param.quocGia}, doTuoi=${param.doTuoi})}" th:text="${i}"></a>
                    </li>
                    <li class="page-item" th:classappend="${moviePage.last ? 'disabled' : ''}">
                        <a class="page-link text-dark" th:href="@{'/movies/' + ${type}(page=${moviePage.number + 2}, search=${param.search}, quocGia=${param.quocGia}, doTuoi=${param.doTuoi})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Load Script cho Mega Menu -->
    <script th:replace="~{user/home :: megaMenuScript}"></script>
</body>
</html>
