<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Hồ Sơ Của Tôi - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
    <style>
        .sidebar-avatar {
            border: 3px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .sidebar-avatar:hover {
            border-color: #ffc107 !important;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        
        <div class="admin-sidebar d-flex flex-column">
            <a th:href="@{/}" class="sidebar-brand fw-bold text-center text-decoration-none text-white d-block">
                <i class="bi bi-film text-warning me-1"></i>Cinema <span class="text-warning">All Star</span>
            </a>
            
            <div class="p-3 text-center border-bottom mb-2" style="border-color: rgba(255,255,255,0.1) !important;">
                <div class="mx-auto mb-2 bg-light rounded-circle d-flex align-items-center justify-content-center sidebar-avatar" style="width: 70px; height: 70px;">
                    <i class="bi bi-person-fill text-secondary" style="font-size: 2.5rem;"></i>
                </div>
                <h6 class="fw-bold mb-1 text-white" sec:authentication="name">Khách Hàng</h6>
                <span class="badge bg-warning text-dark"><i class="bi bi-star-fill me-1"></i>Thành viên</span>
            </div>

            <ul class="sidebar-menu list-unstyled my-3">
                <li class="active">
                    <a th:href="@{/profile}"><i class="bi bi-person-lines-fill me-2"></i>Thông Tin Tài Khoản</a>
                </li>
                <li>
                    <a href="#"><i class="bi bi-ticket-perforated me-2"></i>Lịch Sử Đặt Vé</a>
                </li>
                <li>
                    <a href="#"><i class="bi bi-gift me-2"></i>Khuyến Mãi Của Tôi</a>
                </li>
            </ul>
            
            <!-- Nút Trở Về Trang Chủ -->
            <div class="mt-auto p-3 mb-3">
                <a th:href="@{/}" class="btn btn-warning w-100 fw-bold shadow-sm rounded-3">
                    <i class="bi bi-house-door me-2 text-dark"></i><span class="text-dark">Về Trang Chủ</span>
                </a>
            </div>
        </div>

        <div class="w-100 flex-grow-1 d-flex flex-column bg-light">
            <!-- Header -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm border-bottom">
                <div class="d-flex align-items-center">
                    <h4 class="m-0 fw-bold text-primary">Hồ Sơ Cá Nhân</h4>
                </div>
                <div class="ms-auto d-flex align-items-center">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-danger btn-sm fw-bold">
                            <i class="bi bi-box-arrow-right me-1"></i> Đăng Xuất
                        </button>
                    </form>
                </div>
            </nav>

            <div class="container-fluid p-4">
                <div class="row g-4">
                    <div class="col-md-8">
                        <div class="card border-0 shadow-sm rounded-4 h-100">
                            <div class="card-header bg-white border-bottom py-3">
                                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-person-vcard me-2 text-primary"></i>Chi Tiết Tài Khoản</h5>
                            </div>
                            <div class="card-body p-4">
                                <form>
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Họ và Tên</label>
                                            <input type="text" class="form-control" th:value="${#authentication.name}" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Số Điện Thoại</label>
                                            <input type="text" class="form-control" placeholder="Chưa cập nhật">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Email đăng nhập</label>
                                        <input type="email" class="form-control" placeholder="user@example.com" readonly>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Ngày Sinh</label>
                                        <input type="date" class="form-control">
                                    </div>
                                    <button type="button" class="btn btn-primary fw-bold px-4 rounded-3"><i class="bi bi-floppy me-2"></i>Lưu Thay Đổi</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Cột Thẻ Thành Viên & Điểm -->
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4 text-white text-center p-4 h-100 position-relative overflow-hidden" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
                            <i class="bi bi-film position-absolute text-white opacity-25" style="font-size: 8rem; right: -20px; bottom: -20px;"></i>
                            <div class="position-relative z-1">
                                <h5 class="fw-bold mb-4 text-warning">THẺ THÀNH VIÊN</h5>
                                <div class="bg-white text-dark rounded-circle mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                                    <i class="bi bi-qr-code-scan fs-1"></i>
                                </div>
                                <h3 class="fw-bold mb-1" sec:authentication="name">User</h3>
                                <p class="text-light mb-4 mt-3">Điểm Tích Lũy: <span class="text-warning fw-bold fs-3 ms-1">0</span></p>
                                <button class="btn btn-warning fw-bold w-100 rounded-pill shadow-sm">Đổi Quà Ngay</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
