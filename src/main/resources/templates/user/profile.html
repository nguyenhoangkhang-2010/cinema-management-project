<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ Sơ Của Tôi - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>
<div class="admin-container">

    <!-- SIDEBAR TRÁI: Giữ nguyên cấu trúc Dashboard của bạn -->
    <div class="admin-sidebar d-flex flex-column">
        <a th:href="@{/}" class="sidebar-brand fw-bold text-center text-decoration-none text-white d-block my-4">
           Cinema <span class="text-warning">All Star</span>
        </a>

        <div class="p-3 text-center border-bottom mb-2" style="border-color: rgba(255,255,255,0.1) !important;">
            <div class="mx-auto mb-3 bg-light rounded-circle d-flex align-items-center justify-content-center" style="width: 75px; height: 75px; border: 3px solid rgba(255,255,255,0.15);">
                <i class="bi bi-person-fill text-secondary" style="font-size: 2.5rem;"></i>
            </div>
            <h5 class="fw-bold mb-1 text-white" th:text="${user.hoTen}">Trần Phương</h5>
            <span class="badge bg-warning text-dark fw-bold" th:text="${user.loaiTaiKhoan == 'VIP' ? 'Thành Viên VIP' : (user.loaiTaiKhoan == 'VIP_Pro' ? 'Thành Viên VIP Pro' : 'Thành Viên Thường')}">Thành viên</span>
        </div>

        <ul class="sidebar-menu list-unstyled my-3 px-3">
            <li class="active">
                <a th:href="@{/profile}"><i class="bi bi-person-lines-fill me-2"></i>Thông Tin Tài Khoản</a>
            </li>
            <li>
                <a href="#"><i class="bi bi-ticket-perforated me-2"></i>Lịch Sử Đặt Vé</a>
            </li>
            <li>
                <a href="#"><i class="bi bi-gift me-2"></i>Khuyến Mãi Của Tôi</a>
            </li>
        </ul>

        <div class="mt-auto p-3 mb-3">
            <a th:href="@{/}" class="btn-back-home w-100 fw-bold shadow-sm rounded-3 text-center d-block text-decoration-none">
                <i class="bi bi-house-door me-2"></i>Về Trang Chủ
            </a>
        </div>
    </div>

    <!-- KHU VỰC HIỂN THỊ CHÍNH BÊN PHẢI -->
    <div class="main-content-wrapper flex-grow-1 d-flex flex-column">
        <!-- Header Bar: Đã tách biệt và làm nổi bật hoàn toàn -->
        <nav class="navbar navbar-expand-lg navbar-dark py-3 px-4">
            <div class="d-flex align-items-center">
                <h4 class="m-0 fw-bold text-white header-title">Quản Lý Tài Khoản</h4>
            </div>
            <div class="ms-auto d-flex align-items-center">
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn-logout-neon">
                        <i class="bi bi-box-arrow-right me-1"></i> Đăng Xuất
                    </button>
                </form>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="row g-4">
                <!-- Form điền chi tiết tài khoản màu trắng sáng rõ ràng -->
                <div class="col-md-8">
                    <div class="card border-0 profile-details-card p-4 rounded-4">
                        <h5 class="mb-4 fw-bold text-dark border-bottom pb-3">
                            <i class="bi bi-person-vcard me-2 text-warning"></i>Chi Tiết Hồ Sơ Cá Nhân
                        </h5>
                        <form th:action="@{/profile/update}" method="post">
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Họ và Tên</label>
                                    <input type="text" name="hoTen" class="form-control" th:value="${user.hoTen}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Số Điện Thoại</label>
                                    <input type="text" name="soDienThoai" class="form-control" th:value="${user.soDienThoai != null ? user.soDienThoai : ''}" placeholder="Nhập số điện thoại...">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Email tài khoản (Tên đăng nhập)</label>
                                <input type="email" class="form-control text-muted" th:value="${user.email}" readonly style="cursor: not-allowed; border-bottom-style: dashed !important;">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Ngày Sinh</label>
                                <input type="date" name="ngaySinh" class="form-control" th:value="${user.ngaySinh}">
                            </div>
                            <div class="pt-2">
                                <button type="submit" class="btn btn-warning fw-bold px-4 py-2 rounded-3"><i class="bi bi-floppy me-2"></i>Lưu Thay Đổi</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- THẺ THÀNH VIÊN -->
                <div class="col-md-4">
                    <div class="card border-0 text-white user-cinema-card p-4 h-100 d-flex flex-column justify-content-between shadow-lg">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold tracking-wider text-warning small" style="letter-spacing: 2px;">ALL STAR PASS</span>
                            <i class="bi bi-sim-fill text-warning fs-3"></i>
                        </div>

                        <div class="my-4">
                            <p class="text-secondary small mb-1 opacity-70">Chủ sở hữu thẻ</p>
                            <h4 class="fw-bold text-white m-0" th:text="${user.hoTen}">Trần Phương</h4>
                            <span class="badge rounded-pill px-3 py-1 bg-white bg-opacity-10 text-warning mt-2 small" th:text="${'Cấp độ: ' + user.capDo}">Level 1</span>
                        </div>

                        <div>
                            <p class="text-secondary small mb-0 opacity-70">Hạng tài khoản</p>
                            <h2 class="fw-bold text-warning m-0 text-uppercase" style="letter-spacing: 1px;" th:text="${user.loaiTaiKhoan == 'VIP' ? 'VIP' : (user.loaiTaiKhoan == 'VIP_Pro' ? 'VIP PRO' : 'THƯỜNG')}">VIP</h2>
                            <button class="btn btn-light text-dark fw-bold w-100 rounded-3 py-2.5 shadow-sm mt-3 text-uppercase small">Đổi Quà Tích Lũy</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
