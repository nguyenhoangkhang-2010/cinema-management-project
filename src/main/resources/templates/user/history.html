<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch Sử Đặt Vé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="bg-light">
    <div th:replace="~{user/home :: nav}"></div>

    <div class="container py-5">
        <h3 class="fw-bold mb-4 border-start border-danger border-4 ps-3 text-uppercase">Lịch Sử Đặt Vé Của Bạn</h3>
        
        <div th:if="${history == null or #lists.isEmpty(history)}" class="text-center py-5 bg-white rounded-4 shadow-sm border">
            <i class="bi bi-ticket-perforated text-muted" style="font-size: 4rem;"></i>
            <h5 class="mt-3 text-secondary">Bạn chưa có giao dịch đặt vé nào!</h5>
            <a th:href="@{/}" class="btn btn-danger mt-3 fw-bold rounded-pill px-4">Đặt Vé Ngay</a>
        </div>

        <div class="row g-4">
            <div class="col-md-6" th:each="ticket : ${history}">
                <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
                    <div class="row g-0 h-100">
                        <div class="col-4"><img th:src="${ticket.poster != null ? ticket.poster : 'https://placehold.co/300x450'}" class="img-fluid h-100 object-fit-cover"></div>
                        <div class="col-8">
                            <div class="card-body d-flex flex-column h-100 p-4">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge bg-success" th:if="${ticket.trangThai == 'DaThanhToan'}">Thành công</span>
                                    <span class="text-muted small fw-bold">Mã vé: #<span th:text="${ticket.maDatVe}"></span></span>
                                </div>
                                <h5 class="card-title fw-bold text-dark text-truncate" th:text="${ticket.tenPhim}">Tên phim</h5>
                                <p class="small text-muted mb-1"><i class="bi bi-geo-alt-fill me-1 text-danger"></i><span th:text="${ticket.tenRap} + ' | ' + ${ticket.tenPhong}"></span></p>
                                <p class="small text-muted mb-1"><i class="bi bi-clock-fill me-1 text-warning"></i><span th:text="${ticket.gioBatDau} + ' - ' + ${ticket.ngayChieu}"></span></p>
                                <p class="small fw-bold text-dark mb-3"><i class="bi bi-ui-checks-grid me-1 text-primary"></i>Ghế: <span th:text="${ticket.danhSachGhe}"></span></p>
                                <div class="mt-auto d-flex justify-content-between align-items-end pt-3 border-top">
                                    <div class="small text-muted">Đặt lúc: <br><span th:text="${ticket.ngayDat}"></span></div>
                                    <div class="fs-5 fw-black text-danger" th:text="${#numbers.formatDecimal(ticket.tongTien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
