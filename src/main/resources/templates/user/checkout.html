<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán Đặt Vé - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .checkout-container { background-color: #f8f9fa; min-height: 100vh; padding-bottom: 50px; }
        .movie-checkout-card { border-radius: 16px; overflow: hidden; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .poster-checkout { width: 100%; height: 350px; object-fit: cover; border-radius: 12px; }
        .summary-card { background: #1a1c24; color: #fff; border-radius: 16px; border: 1px solid #333; position: sticky; top: 100px; }
        .dash-border { border-bottom: 1px dashed #444; margin: 15px 0; }
        .seat-badge { background: #dc2626; color: white; padding: 5px 12px; border-radius: 8px; font-weight: bold; margin-right: 5px; margin-bottom: 5px; display: inline-block; }
        .btn-pay { background: linear-gradient(90deg, #dc2626, #f59e0b); color: white; font-weight: 800; font-size: 1.1rem; padding: 15px; border: none; border-radius: 12px; transition: all 0.3s; }
        .btn-pay:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(220, 38, 38, 0.4); color: white; }
    </style>
</head>
<body class="checkout-container">

    <!-- Nhúng Header -->
    <div th:replace="~{user/home :: nav}"></div>

    <div class="container py-5">
        <div class="mb-4">
            <h2 class="fw-bold text-dark"><i class="bi bi-credit-card-fill text-danger me-2"></i>Thanh Toán Đặt Vé</h2>
            <p class="text-muted">Vui lòng kiểm tra kỹ thông tin trước khi tiến hành thanh toán.</p>
        </div>
        
        <!-- Hiển thị lỗi hệ thống nếu thanh toán thất bại -->
        <div th:if="${error}" class="alert alert-danger shadow-sm border-0 rounded-3 mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="row g-4">
            <!-- Cột trái: Thông tin vé & Rạp -->
            <div class="col-lg-8">
                <div class="card movie-checkout-card p-4">
                    <div class="row g-4">
                        <div class="col-md-4">
                            <img th:src="${checkout.poster != null ? checkout.poster : 'https://placehold.co/300x450'}" class="poster-checkout shadow-sm">
                        </div>
                        <div class="col-md-8 d-flex flex-column justify-content-center">
                            <span class="badge bg-danger mb-2" style="width: fit-content;">T<span th:text="${checkout.doTuoi}"></span></span>
                            <h3 class="fw-bold text-uppercase text-dark mb-3" th:text="${checkout.movieName}">Tên Phim</h3>
                            
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-building text-secondary me-3 fs-5"></i>
                                <div>
                                    <p class="m-0 fw-bold text-dark" th:text="${checkout.cinemaName}">Rạp</p>
                                    <small class="text-muted" th:text="'Phòng chiếu: ' + ${checkout.roomName}">Phòng</small>
                                </div>
                            </div>
                            
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-calendar-event text-secondary me-3 fs-5"></i>
                                <div>
                                    <p class="m-0 fw-bold text-danger"><span th:text="${checkout.showTime}"></span> - <span th:text="${checkout.showDate}"></span></p>
                                </div>
                            </div>

                            <div class="mt-3 p-3 bg-light rounded-3 border">
                                <p class="fw-bold text-dark mb-2"><i class="bi bi-ui-checks-grid me-2"></i>Ghế đã chọn:</p>
                                <div>
                                    <span class="seat-badge shadow-sm" th:each="seat : ${checkout.selectedSeats}" th:text="${seat.seatNumber}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Hóa đơn thanh toán (Bill Summary) -->
            <div class="col-lg-4">
                <div class="card summary-card p-4 shadow-lg">
                    <h5 class="fw-bold text-warning mb-4"><i class="bi bi-receipt me-2"></i>Tóm Tắt Đơn Hàng</h5>
                    
                    <!-- Liệt kê từng ghế và giá tiền -->
                    <div class="d-flex justify-content-between align-items-center mb-2" th:each="seat : ${checkout.selectedSeats}">
                        <span class="text-light opacity-75">Ghế <strong class="text-white" th:text="${seat.seatNumber}"></strong> (<span th:text="${seat.seatType}"></span>)</span>
                        <span class="fw-medium text-white" th:text="${#numbers.formatDecimal(seat.seatTotalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>

                    <div class="dash-border"></div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-light opacity-75">Tạm tính</span>
                        <span class="fw-bold text-white" th:text="${#numbers.formatDecimal(checkout.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        <input type="hidden" id="originalTotal" th:value="${checkout.totalPrice}">
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-light opacity-75">Khuyến mãi</span>
                        <span class="fw-bold text-success" id="discountAmount">- 0 đ</span>
                    </div>

                    <div class="dash-border"></div>

                    <!-- Khu vực nhập mã -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-light opacity-75">MÃ ƯU ĐÃI / KHUYẾN MÃI</label>
                        <div class="input-group">
                            <select id="promoInput" class="form-select bg-dark text-white border-secondary shadow-none">
                                <option value="">-- Chọn mã khuyến mãi --</option>
                                <option th:each="promo : ${activePromotions}" 
                                        th:value="${promo.maKhuyenMai}" 
                                        th:text="${promo.tenKhuyenMai + ' (Giảm ' + #numbers.formatDecimal(promo.phanTramGiam, 0, 0) + '%)'}"
                                        th:selected="${#strings.equals(param.promoId, promo.maKhuyenMai)}"></option>
                            </select>
                            <button class="btn btn-outline-warning fw-bold" type="button" onclick="applyPromo()">ÁP DỤNG</button>
                        </div>
                        <small id="promoMessage" class="d-block mt-2"></small>
                    </div>

                    <div class="dash-border"></div>

                    <div class="d-flex justify-content-between align-items-end mb-4">
                        <span class="text-light fw-bold fs-5">TỔNG TIỀN</span>
                        <span class="fw-black text-warning fs-3" id="finalTotal" th:text="${#numbers.formatDecimal(checkout.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>

                    <!-- Form submit tới cổng thanh toán VNPay/MoMo (sẽ làm ở bước sau) -->
                    <form th:action="@{/payment/confirm}" method="post">
                        <input type="hidden" name="showtimeId" th:value="${checkout.showtimeId}">
                        <input type="hidden" th:each="seat : ${checkout.selectedSeats}" name="seatIds" th:value="${seat.seatId}">
                        <input type="hidden" name="totalAmount" id="submitTotalPrice" th:value="${checkout.totalPrice}">
                        <input type="hidden" name="promoId" id="submitPromoId" th:value="${param.promoId}">
                        <button type="submit" class="btn w-100 btn-pay shadow-lg"><i class="bi bi-shield-lock-fill me-2"></i>THANH TOÁN NGAY</button>
                    </form>
                    <p class="text-center text-muted small mt-3 m-0"><i class="bi bi-clock-history me-1"></i>Thời gian giữ ghế: <strong class="text-warning">10:00</strong></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Tự động kiểm tra và áp dụng nếu URL có parameter ?promoId= (VD: ấn từ trang danh sách KM)
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('promoId')) {
                applyPromo();
            }
        });

        function applyPromo() {
            const promoId = document.getElementById('promoInput').value;
            if (!promoId) return;
            
            const msgEl = document.getElementById('promoMessage');
            msgEl.className = "d-block mt-2 text-warning";
            msgEl.innerText = "Đang kiểm tra dữ liệu mã...";

            const originalTotal = parseFloat(document.getElementById('originalTotal').value.replace(/[^0-9]/g, '')) || 0;

            fetch(`/api/promotion/apply/${promoId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ originalTotal: originalTotal })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    msgEl.className = "d-block mt-2 text-success fw-bold";
                    msgEl.innerText = "Áp dụng thành công! Đơn hàng đã được cập nhật.";
                    document.getElementById('discountAmount').innerText = '- ' + new Intl.NumberFormat('vi-VN').format(data.discountAmount) + ' đ';
                    document.getElementById('finalTotal').innerText = new Intl.NumberFormat('vi-VN').format(data.finalTotal) + ' đ';
                    document.getElementById('submitTotalPrice').value = data.finalTotal;
                    document.getElementById('submitPromoId').value = promoId;
                } else {
                    msgEl.className = "d-block mt-2 text-danger fw-bold";
                    msgEl.innerText = data.message;
                }
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
