<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xem Phim - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="bg-dark text-light">

    <!-- Nhúng Navbar chung của hệ thống -->
    <div th:replace="~{user/home :: nav}"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-warning m-0" th:text="${movie.tenPhim}">Tên Phim</h3>
            <a th:href="@{/phim-online}" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
        </div>

        <!-- Trình phát Video (Video Player) -->
        <div class="ratio ratio-16x9 bg-black rounded-4 shadow overflow-hidden mb-4 border border-secondary">
            <!-- Nếu lấy được Video từ CSDL, tải link đầu tiên (videos[0][0]) -->
            <iframe th:if="${not #lists.isEmpty(videos)}" 
                    th:src="${#strings.replace(#strings.replace(videos[0][0], 'watch?v=', 'embed/'), 'youtu.be/', 'www.youtube.com/embed/')}" 
                    allowfullscreen 
                    style="border:none;"></iframe>
            
            <!-- Nếu không có Video từ DB, lấy tạm link Trailer làm nguồn phát Phim Online -->
            <iframe th:if="${#lists.isEmpty(videos) and movie.trailer != null and movie.trailer != ''}" 
                    th:src="${#strings.replace(#strings.replace(movie.trailer, 'watch?v=', 'embed/'), 'youtu.be/', 'www.youtube.com/embed/')}" 
                    allowfullscreen 
                    style="border:none;"></iframe>

            <!-- Nếu hoàn toàn không có link nào cả -->
            <div th:if="${#lists.isEmpty(videos) and (movie.trailer == null or movie.trailer == '')}" class="d-flex align-items-center justify-content-center text-muted flex-column h-100">
                <i class="bi bi-camera-video-off display-1 mb-3 text-secondary"></i>
                <h5>Phim đang được cập nhật đường dẫn video...</h5>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-8">
                <h5 class="fw-bold mb-3 border-bottom border-secondary pb-2">Nội dung phim</h5>
                <p class="text-light opacity-75 lh-lg text-justify" th:text="${movie.moTa}">Mô tả nội dung...</p>
            </div>
            <div class="col-md-4">
                <div class="card bg-secondary text-light border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h6 class="fw-bold border-bottom border-dark pb-3 mb-3">Thông tin chi tiết</h6>
                        <p class="mb-2"><small><strong>Đạo diễn:</strong> <span th:text="${movie.daoDien}"></span></small></p>
                        <p class="mb-2"><small><strong>Quốc gia:</strong> <span th:text="${movie.quocGia}"></span></small></p>
                        <p class="mb-0"><small><strong>Thời lượng:</strong> <span th:text="${movie.thoiLuong}"></span> phút</small></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
