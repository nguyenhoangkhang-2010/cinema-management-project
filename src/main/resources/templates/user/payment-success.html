<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán Thành Công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="bg-light">
    <div th:replace="~{user/home :: nav}"></div>
    
    <div class="container py-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width: 600px;">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            <h2 class="fw-bold mt-3 text-dark">Thanh Toán Hoàn Tất!</h2>
            <p class="text-muted fs-5">Cảm ơn bạn đã đặt vé tại Cinema All Star.</p>
            <p class="fw-bold bg-light p-3 rounded-3 text-danger border">Mã Đơn Đặt Vé: #<span th:text="${orderId}"></span></p>
            <p class="small text-muted mb-4">Mã vé QR Code đã được cập nhật vào tài khoản của bạn.</p>
            
            <div class="d-flex gap-3 justify-content-center">
                <a th:href="@{/}" class="btn btn-outline-dark fw-bold px-4 rounded-pill">Về Trang Chủ</a>
                <a th:href="@{/user/history}" class="btn btn-danger fw-bold px-4 rounded-pill shadow-sm">Xem Lịch Sử Vé</a>
            </div>
        </div>
    </div>
</body>
</html>
