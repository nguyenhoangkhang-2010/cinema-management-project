<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Khuyến Mãi - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        /* Làm đẹp Card Khuyến Mãi */
        .promo-card {
            border-radius: 16px !important;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.05) !important;
        }
        .promo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1) !important;
        }
        .promo-img-wrapper {
            overflow: hidden;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }
        .custom-promo-img {
            height: 180px;
            width: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .promo-card:hover .custom-promo-img {
            transform: scale(1.08);
        }
        .promo-badge {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    
    <!-- Nhúng Header Chuẩn -->
    <div th:replace="~{user/home :: nav}"></div>

    <!-- NỘI DUNG CHÍNH: KHUYẾN MÃI -->
    <div class="container py-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0 border-start border-warning border-4 ps-3 text-dark">Chương Trình Khuyến Mãi</h2>
            <!-- Nút Tạo Code Mới: Chỉ Admin mới thấy -->
            <a sec:authorize="hasRole('Admin')" th:href="@{/admin/promotions/add}" class="btn btn-warning btn-sm text-dark fw-bold shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>Tạo code mới
            </a>
        </div>

        <!-- Thanh tìm kiếm Khuyến Mãi -->
        <div class="row mb-4">
            <div class="col-md-6 offset-md-3">
                <div class="input-group shadow-sm rounded-pill overflow-hidden border bg-white">
                    <span class="input-group-text bg-white border-0 text-warning px-3"><i class="bi bi-search"></i></span>
                    <input type="text" id="promoSearchInput" class="form-control border-0 shadow-none px-2 py-2" placeholder="Tìm kiếm khuyến mãi (vd: giảm giá, hssv...)">
                </div>
            </div>
        </div>

        <div class="row">
            <th:block th:if="${khuyenMai != null and !#lists.isEmpty(khuyenMai)}">
                <div class="col-md-3 mb-4 promo-item-container" th:each="promo : ${khuyenMai}">
                    <div class="card shadow-sm h-100 promo-card">
                        <div class="position-relative promo-img-wrapper">
                            <img th:src="${promo.poster != null and promo.poster != ''} ? ${promo.poster} : 'https://placehold.co/600x400?text=Cinema+All+Star'"
                                 class="custom-promo-img" alt="Khuyến mãi">
                            <!-- Nhãn giảm giá nổi bật đè lên ảnh -->
                            <div class="position-absolute top-0 end-0 m-2" th:if="${promo.phanTramGiam != null}">
                                <span class="badge promo-badge fs-6 px-3 py-2 rounded-pill" 
                                      th:text="${'GIẢM ' + #numbers.formatDecimal(promo.phanTramGiam, 1, 0) + '%'}">-10%</span>
                            </div>
                        </div>
                        <div class="card-body text-center p-4">
                            <h6 class="fw-bold text-dark mb-2 promo-title" th:text="${promo.tenKhuyenMai}">Tiêu đề khuyến mãi</h6>
                            <p class="text-muted small mb-0"><i class="bi bi-tag-fill text-warning me-1"></i>Ưu đãi độc quyền</p>
                        </div>
                    </div>
                </div>
            </th:block>
            <div class="col-12 text-center py-5 text-muted bg-white rounded shadow-sm" th:if="${khuyenMai == null or #lists.isEmpty(khuyenMai)}">
                <i class="bi bi-gift fs-1 text-secondary mb-3 d-block"></i>
                <h5 class="fw-medium mb-0">Chưa có chương trình khuyến mãi nào đang diễn ra!</h5>
                <p class="mt-2 text-muted">Vui lòng quay lại sau để không bỏ lỡ ưu đãi nhé.</p>
            </div>
        </div>
        
        <!-- Phân trang Khuyến Mãi -->
        <div class="d-flex justify-content-center mt-4">
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm shadow-sm" id="paginationControls">
                    <!-- Nút chuyển trang sẽ được tạo bằng JavaScript -->
                </ul>
            </nav>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light mt-auto py-4">
        <div class="container text-center">
            <p class="mb-0">Cinema All Star - Hệ thống rạp chiếu phim hàng đầu &copy; 2026</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Load Script cho Mega Menu -->
    <script th:replace="~{user/home :: megaMenuScript}"></script>

    <!-- Script Xử lý Tìm kiếm Động (Real-time Search) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('promoSearchInput');
            const promoCards = Array.from(document.querySelectorAll('.promo-item-container'));
            const paginationControls = document.getElementById('paginationControls');
            const itemsPerPage = 8;
            let currentPage = 1;
            let filteredCards = [...promoCards];

            // Hàm loại bỏ dấu tiếng Việt (VD: "Khuyến mãi" -> "khuyen mai")
            function removeAccents(str) {
                return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            }

            // Hàm lấy chữ cái đầu của mỗi từ tạo thành chữ viết tắt (VD: "khuyen mai" -> "km")
            function getAbbreviation(str) {
                return str.trim().split(/\s+/).map(word => word.charAt(0)).join('').toLowerCase();
            }

            function renderCards() {
                // Ẩn tất cả các card trước
                promoCards.forEach(card => card.style.display = 'none');
                
                // Tính toán vị trí cắt mảng và hiển thị
                if (filteredCards.length > 0) {
                    const startIndex = (currentPage - 1) * itemsPerPage;
                    const endIndex = startIndex + itemsPerPage;
                    
                    filteredCards.slice(startIndex, endIndex).forEach(card => card.style.display = '');
                }
                
                renderPagination();
            }

            function renderPagination() {
                paginationControls.innerHTML = '';
                const totalPages = Math.ceil(filteredCards.length / itemsPerPage);
                
                if (totalPages <= 1) return; // Nếu ít hơn 8 bài thì không hiện nút trang

                // Nút Previous
                const prevLi = document.createElement('li');
                prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
                prevLi.innerHTML = `<a class="page-link text-warning fw-bold" href="#" aria-label="Previous">&laquo;</a>`;
                prevLi.onclick = (e) => { e.preventDefault(); if (currentPage > 1) { currentPage--; renderCards(); } };
                paginationControls.appendChild(prevLi);

                // Các nút số trang (1, 2, 3...)
                for (let i = 1; i <= totalPages; i++) {
                    const li = document.createElement('li');
                    li.className = `page-item ${currentPage === i ? 'active' : ''}`;
                    li.innerHTML = `<a class="page-link ${currentPage === i ? 'bg-warning border-warning text-dark' : 'text-dark'}" href="#">${i}</a>`;
                    li.onclick = (e) => { e.preventDefault(); currentPage = i; renderCards(); };
                    paginationControls.appendChild(li);
                }

                // Nút Next
                const nextLi = document.createElement('li');
                nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
                nextLi.innerHTML = `<a class="page-link text-warning fw-bold" href="#" aria-label="Next">&raquo;</a>`;
                nextLi.onclick = (e) => { e.preventDefault(); if (currentPage < totalPages) { currentPage++; renderCards(); } };
                paginationControls.appendChild(nextLi);
            }

            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                const searchTerm = removeAccents(e.target.value.trim());

                    filteredCards = promoCards.filter(card => {
                        const titleElement = card.querySelector('.promo-title');
                        if (!titleElement) return false;
                        const normalizedTitle = removeAccents(titleElement.textContent);
                        const abbreviation = getAbbreviation(normalizedTitle);
                        return normalizedTitle.includes(searchTerm) || abbreviation.includes(searchTerm);
                    });
                    
                    currentPage = 1; // Nhập tìm kiếm thì quay về trang 1
                    renderCards();
                });
            }

            renderCards(); // Hiển thị lần đầu tiên tải trang
        });
    </script>
</body>
</html>
