<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chọn Ghế - Cinema All Star</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        body { background-color: #f1f5f9; }
        .screen-curve {
            width: 100%; height: 50px; background: #d1d5db; border-radius: 50% / 100% 100% 0 0;
            box-shadow: 0 15px 20px rgba(0,0,0,0.05); margin-bottom: 50px; text-align: center;
            line-height: 50px; color: #64748b; font-weight: bold; letter-spacing: 5px;
        }
        .seat-map-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .seat-grid { display: flex; flex-wrap: wrap; justify-content: center; max-width: 600px; gap: 8px; }
        .seat {
            width: 42px; height: 42px; border-radius: 8px; display: inline-flex;
            align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold;
            cursor: pointer; transition: all 0.2s; border: 2px solid transparent;
        }
        .seat.available { background-color: #f1f5f9; color: #475569; border-color: #cbd5e1; }
        .seat.available:hover { background-color: #e2e8f0; border-color: #94a3b8; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .seat.selected { background-color: #f59e0b; color: white; border-color: #d97706; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); transform: scale(1.08); }
        .seat.booked { background-color: #334155; color: #64748b; cursor: not-allowed; opacity: 0.95; border-color: #1e293b; }
        .seat.vip { background-color: #fef3c7; color: #b45309; border-color: #fcd34d; }
        .seat.vip.selected { background-color: #f59e0b; color: white; border-color: #d97706; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #475569; }
        .legend-box { width: 20px; height: 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <div th:replace="~{user/home :: nav}"></div>

    <div class="container py-5">
        <div class="row g-4">
            <!-- Khu vực sơ đồ ghế -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 h-100">
                    <div class="screen-curve">MÀN HÌNH CHÍNH</div>
                    
                    <div class="seat-map-container mb-5">
                        <div class="seat-grid" id="seat-map">
                            <p th:if="${#lists.isEmpty(data.seats)}" class="text-danger fw-bold w-100 text-center"><i class="bi bi-exclamation-triangle-fill me-2"></i>Phòng chiếu này chưa được thiết lập sơ đồ ghế thực tế trong cơ sở dữ liệu.</p>
                            <th:block th:each="seat : ${data.seats}">
                                <div class="seat" 
                                     th:classappend="${seat.daDat ? 'booked' : (seat.loaiGhe == 'VIP' ? 'vip available' : 'available')}"
                                     th:data-id="${seat.maGhe}"
                                     th:data-price="${data.basePrice + seat.phuThu}"
                                     th:data-name="${seat.soGhe}"
                                     th:title="${seat.loaiGhe} + ' - ' + ${#numbers.formatDecimal(data.basePrice + seat.phuThu, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                                     th:onclick="${!seat.daDat} ? 'toggleSeat(this)' : ''"
                                     th:text="${seat.soGhe}">
                                </div>
                            </th:block>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-4 flex-wrap border-top pt-4 mt-auto">
                        <div class="legend-item"><div class="legend-box available border"></div> Ghế thường</div>
                        <div class="legend-item"><div class="legend-box vip border border-warning"></div> Ghế VIP</div>
                        <div class="legend-item"><div class="legend-box bg-danger"></div> Đang chọn</div>
                        <div class="legend-item"><div class="legend-box booked"></div> Đã đặt</div>
                    </div>
                </div>
            </div>

            <!-- Khu vực thông tin thanh toán -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 20px;">
                    <div class="d-flex gap-3 mb-4">
                        <img th:src="${data.poster}" class="rounded shadow-sm" style="width: 80px; height: 120px; object-fit: cover;">
                        <div>
                            <h5 class="fw-bold text-dark mb-1" th:text="${data.movieName}">Tên Phim</h5>
                            <p class="text-muted small mb-1"><i class="bi bi-shop-window me-1"></i><span th:text="${data.cinemaName} + ' | ' + ${data.roomName}"></span></p>
                            <p class="text-danger fw-bold small m-0"><i class="bi bi-clock me-1"></i><span th:text="${data.showTime}"></span> - <span th:text="${data.showDate}"></span></p>
                        </div>
                    </div>

                    <div class="bg-light rounded-3 p-3 mb-4 border">
                        <p class="text-muted fw-bold small mb-2">Ghế đang chọn:</p>
                        <div id="selected-seats-list" class="fw-bold text-dark fs-5" style="min-height: 30px;">...</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-end mb-4 border-top pt-3">
                        <span class="text-muted fw-bold">Tạm tính:</span>
                        <span class="fs-3 fw-black text-danger" id="total-price">0 đ</span>
                    </div>

                    <form th:action="@{/checkout/{id}(id=${data.showtimeId})}" method="get" id="checkout-form" onsubmit="return validateSelection()">
                        <div id="hidden-inputs"></div>
                        <button type="submit" class="btn btn-danger w-100 py-3 fw-bold fs-6 rounded-3 shadow" id="btn-continue" disabled>
                            Tiếp Tục Thanh Toán <i class="bi bi-arrow-right-circle ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedSeats = [];
        let totalPrice = 0;

        function toggleSeat(element) {
            const seatId = element.getAttribute('data-id');
            const seatName = element.getAttribute('data-name');
            const seatPrice = parseFloat(element.getAttribute('data-price'));

            if (element.classList.contains('selected')) {
                element.classList.remove('selected');
                selectedSeats = selectedSeats.filter(s => s.id !== seatId);
                totalPrice -= seatPrice;
            } else {
                if (selectedSeats.length >= 8) { 
                    Swal.fire({ icon: 'warning', title: 'Giới hạn', text: 'Chỉ có thể chọn tối đa 8 ghế trong một lần đặt!', confirmButtonColor: '#dc2626' }); 
                    return; 
                }
                element.classList.add('selected');
                selectedSeats.push({ id: seatId, name: seatName });
                totalPrice += seatPrice;
            }
            
            document.getElementById('selected-seats-list').innerText = selectedSeats.map(s => s.name).join(', ') || '...';
            document.getElementById('total-price').innerText = new Intl.NumberFormat('vi-VN').format(totalPrice) + ' đ';
            document.getElementById('hidden-inputs').innerHTML = selectedSeats.map(s => `<input type="hidden" name="seats" value="${s.id}">`).join('');
            document.getElementById('btn-continue').disabled = selectedSeats.length === 0;
        }
        
        function validateSelection() {
            return selectedSeats.length > 0;
        }
    </script>
</body>
</html>
